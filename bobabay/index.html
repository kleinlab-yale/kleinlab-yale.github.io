<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;color:#2a1f3d;
 font-family:'Fredoka','Baloo 2',ui-rounded,'SF Pro Rounded','Nunito','Varela Round','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
body{background:radial-gradient(circle at 50% 30%,#6b56c9,#2b2350)}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;background:none;outline:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;border-radius:30px;background:#bfe9ff;box-shadow:0 20px 60px rgba(0,0,0,.4);touch-action:none}
#bg,#ents,#night,#party,#lights,#fx,#hud,#map,#toasts,#modal,#title{position:absolute;left:0;top:0;width:100%;height:100%}
#bg svg{display:block}
#ents{z-index:1;pointer-events:none}
#night{z-index:2;pointer-events:none;background:#1b1850;opacity:0;mix-blend-mode:multiply;transition:opacity .4s}
.night #night{opacity:.6}
#party{z-index:3;pointer-events:none;opacity:0;background:radial-gradient(circle at 20% 30%,rgba(255,92,122,.55),transparent 40%),radial-gradient(circle at 80% 30%,rgba(122,211,255,.55),transparent 40%),radial-gradient(circle at 50% 85%,rgba(255,210,63,.55),transparent 45%)}
.party #party{opacity:1;animation:party 1.4s linear infinite}
@keyframes party{50%{filter:hue-rotate(180deg)}100%{filter:hue-rotate(360deg)}}
#lights{z-index:4;pointer-events:none}
#lights .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,238,170,.72),rgba(255,238,170,.28) 40%,rgba(255,238,170,0) 70%)}
#map{z-index:40;display:none}
#hud{z-index:50;pointer-events:none}
#modal{z-index:80;display:none}
#fx{z-index:85;pointer-events:none}
#toasts{z-index:88;pointer-events:none}
#title{z-index:90;display:none}
#stage.enter #ents,#stage.enter #bg{animation:fadein .32s}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}}

/* ---------- things ---------- */
.ent{position:absolute;left:0;top:0;pointer-events:none}
.ent>.in{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 100%;transition:transform .12s}
.ent .g,.ent .f,.ent .kids{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ent .g{z-index:0}.ent .k1{z-index:1}.ent .f{z-index:2}.ent .k2{z-index:3}
.ent svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;display:block}
.ent svg *{pointer-events:visiblePainted;cursor:grab}
.ent svg .np,.ent svg .np *{pointer-events:none}
.ent svg .hit{pointer-events:all}
.ent.k-fix svg *{cursor:pointer}
.painting .ent svg *,.painting #bg{cursor:crosshair}
.ent.flip>.in>.g>svg,.ent.flip>.in>.f>svg{transform:scaleX(-1)}
.ent.drag>.in{transform:scale(1.07) rotate(-3deg);filter:drop-shadow(0 16px 10px rgba(30,10,60,.28))}
.ent.sm>.in{transform:scale(.68)}
.ent.hd>.in{transform:scale(1.1)}
.ent.big>.in{transform:scale(1.45)}
.ent.tiny>.in{transform:scale(.55)}
.ent.gone>.in{transform:scale(0);transition:transform .2s}
.ent.rbw>.in>.g [data-p="b"]{animation:rbw 1.6s linear infinite}
@keyframes rbw{0%,100%{fill:#ff5c7a}17%{fill:#ff8552}33%{fill:#ffd23f}50%{fill:#56d39a}67%{fill:#7ad3ff}83%{fill:#9b6bff}}
.ent.zz::after{content:'z z Z';position:absolute;left:62%;top:-36px;font-weight:700;font-size:30px;color:#6c63ff;text-shadow:0 2px 0 #fff;animation:zzz 2.4s ease-in-out infinite;white-space:nowrap;pointer-events:none}
.ent.lie.zz::after{left:70%;top:6px}
@keyframes zzz{0%{opacity:0;transform:translate(0,10px) scale(.7)}40%{opacity:1}100%{opacity:0;transform:translate(26px,-44px) scale(1.1)}}
.ent.bob>.in,.ent.bobf>.in{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}
.ent.swinging>.in>.k1,.ent.swinging>.in>.f{animation:swing 1.9s ease-in-out infinite;transform-origin:50% 4%}
@keyframes swing{0%,100%{transform:rotate(11deg)}50%{transform:rotate(-11deg)}}
.party .k-char>.in,.party .k-pet>.in{animation:dance .5s ease-in-out infinite}
.k-char>.in>.g,.k-pet>.in>.g{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.012,.988)}}
.in.a-pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.in.a-land{animation:land .24s}
.in.a-wig{animation:wig .32s}
.in.a-hop{animation:hop .42s}
.in.a-chomp{animation:chomp .22s}
.in.a-shake{animation:shake .5s}
.in.a-bounce{animation:bounce .65s}
.in.a-dance{animation:dance .4s 3}
.in.a-buzz{animation:buzz .1s 13}
.in.a-spin{animation:spinY .6s}
.in.a-launch{animation:launch 1.6s ease-in-out}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes land{0%{transform:scale(1.14,.84)}55%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-40px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.08,.92)}}
@keyframes chomp{50%{transform:scale(1.06,.93)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%{transform:translateY(0) scale(1.1,.86)}25%{transform:translateY(-70px)}50%{transform:translateY(0) scale(1.08,.9)}70%{transform:translateY(-26px)}100%{transform:translateY(0)}}
@keyframes dance{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-14px)}}
@keyframes buzz{0%,100%{transform:translateX(-3px) rotate(-1deg)}50%{transform:translateX(3px) rotate(1deg)}}
@keyframes spinY{to{transform:rotateY(360deg)}}
@keyframes launch{0%{transform:translateY(0)}45%{transform:translateY(-640px)}55%{transform:translateY(-640px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
/* little animations that live inside the drawings */
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.chew{animation:chew .3s infinite;transform-box:fill-box;transform-origin:center}
@keyframes chew{50%{transform:scaleY(.35)}}
.wag{animation:wag .9s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.steam{animation:steam 1.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.spin{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sunspin{animation:spin 18s linear infinite}
.ccspin{animation:spin 3s linear infinite}
.ent .glow{animation:ovglow .8s ease-in-out infinite alternate}
@keyframes ovglow{from{opacity:.55}to{opacity:1}}
.tvb{animation:tvb 1.2s ease-in-out infinite}
@keyframes tvb{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,-40px)}}
.tvf{animation:tvf 4s linear infinite}
@keyframes tvf{0%{transform:translateX(-130px)}100%{transform:translateX(230px)}}
.tvr{animation:tvr 1.4s ease-in-out infinite}
@keyframes tvr{50%{transform:translateY(-12px)}}
.fishA{animation:fa 5s ease-in-out infinite}
@keyframes fa{50%{transform:translateX(84px)}}
.fishB{animation:fb 6s ease-in-out infinite}
@keyframes fb{50%{transform:translateX(-92px)}}
.bub{animation:bub 2.4s ease-in infinite}
@keyframes bub{0%{transform:translateY(14px);opacity:0}30%{opacity:.8}100%{transform:translateY(-34px);opacity:0}}
.lavab{animation:lava 4s ease-in-out infinite}
@keyframes lava{50%{transform:translateY(-22px)}}
.flame{animation:flame .45s ease-in-out infinite alternate;transform-origin:50% 100%;transform-box:fill-box}
@keyframes flame{to{transform:scale(1.07,.9)}}
.drip{animation:drip .3s linear infinite}
@keyframes drip{50%{opacity:.55}}
.discospin{animation:disco 1.6s linear infinite}
@keyframes disco{50%{filter:hue-rotate(180deg) brightness(1.15)}}
.snowing{animation:snow .9s linear infinite}
@keyframes snow{0%{transform:translateY(-12px)}100%{transform:translateY(14px)}}
.tw{animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}

/* ---------- effects ---------- */
.fx{position:absolute;pointer-events:none}
.fx i{display:block}
.fx.pt{animation:fly .8s ease-out both;margin:-10px 0 0 -10px}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.fx.rise{animation:rise 1.2s ease-out both;margin-left:-15px}
@keyframes rise{0%{transform:translateY(10px) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-96px) scale(1.1);opacity:0}}
.fx.bubl i{border-radius:50%;border:3px solid #fff;background:rgba(190,240,255,.5)}
.fx.say{transform:translate(-50%,-100%);background:#fff;border:3.5px solid #35252d;border-radius:24px;padding:8px 20px;font-size:28px;font-weight:600;box-shadow:0 4px 0 rgba(53,37,45,.2);animation:sayin .25s cubic-bezier(.3,1.6,.5,1);width:max-content;max-width:540px;text-align:center;line-height:1.15}
.fx.say::after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-9px;width:16px;height:16px;background:#fff;border-right:3.5px solid #35252d;border-bottom:3.5px solid #35252d;transform:rotate(45deg);border-radius:0 0 5px 0}
@keyframes sayin{from{transform:translate(-50%,-80%) scale(.4);opacity:0}}

/* ---------- buttons on screen ---------- */
.rb{position:absolute;width:88px;height:88px;border-radius:50%;background:#fff;border:3.5px solid #35252d;box-shadow:0 5px 0 rgba(53,37,45,.28);pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.rb:active{transform:scale(.92)}
.rb svg{width:54px;height:54px}
.rb.act{background:#ffd23f}
#b-map{left:22px;top:22px}
#topbar{position:absolute;left:126px;top:34px;display:flex;gap:10px;align-items:center}
#sname{height:64px;line-height:57px;padding:0 28px;border-radius:32px;background:#fff;border:3.5px solid #35252d;font-size:30px;font-weight:600;box-shadow:0 5px 0 rgba(53,37,45,.28);white-space:nowrap}
#b-set{right:22px;top:22px}
#b-stars{position:absolute;right:126px;top:30px;height:72px;padding:0 28px 0 14px;border-radius:36px;background:#fff;border:3.5px solid #35252d;box-shadow:0 5px 0 rgba(53,37,45,.28);display:flex;align-items:center;gap:8px;font-size:36px;font-weight:700;pointer-events:auto}
#b-stars svg{width:50px;height:50px}
#b-stars:active{transform:scale(.94)}
#b-paint{left:22px;top:132px}
#b-cat{left:22px;top:236px}
.nav{height:60px;padding:0 20px 0 12px;border-radius:30px;background:#6c63ff;border:3.5px solid #35252d;color:#fff;font-size:23px;font-weight:600;display:flex;align-items:center;gap:4px;pointer-events:auto;box-shadow:0 5px 0 rgba(53,37,45,.28);white-space:nowrap}
#nav-r{padding:0 12px 0 20px}
.nav svg{width:32px;height:32px}
.nav:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(30,10,60,.2)}
#pack{position:absolute;right:20px;bottom:18px;width:130px;height:130px;pointer-events:auto;cursor:pointer;transition:transform .15s;z-index:3}
#pack svg{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(30,10,60,.18));overflow:visible}
#pack .lid{transition:transform .15s;transform-origin:50% 100%;transform-box:fill-box}
#pack.open{transform:scale(1.22)}
#pack.open .lid{transform:rotate(-26deg) translateY(-6px)}
#pack.act svg{filter:drop-shadow(0 0 0 #ffd23f) drop-shadow(0 6px 0 rgba(30,10,60,.18))}
#pack.bump{animation:land .3s}
#pack .badge{position:absolute;right:-2px;top:2px;min-width:44px;height:44px;border-radius:22px;background:#6c63ff;color:#fff;font-size:24px;font-weight:700;line-height:44px;text-align:center;padding:0 8px;box-shadow:0 3px 0 rgba(30,10,60,.2)}
#trash{position:absolute;left:22px;bottom:22px;width:108px;height:108px;border-radius:50%;background:#fff;border:3.5px solid #35252d;box-shadow:0 5px 0 rgba(53,37,45,.28);display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .15s,background .15s;z-index:3}
#trash svg{width:64px;height:64px}
.dragging #trash{transform:scale(1)}
.dragging #trash.open{transform:scale(1.25);background:#ffb3c7}
.onmap #b-map,.onmap #topbar,.onmap #b-paint,.onmap #b-cat,.onmap .nav,.onmap #pack,.onmap #trash,.onmap #tray,.onmap #stylep{display:none!important}

/* ---------- trays (backpack / catalog / paint) ---------- */
#tray{position:absolute;left:150px;right:170px;bottom:16px;background:#fff;border:3.5px solid #35252d;border-radius:30px;box-shadow:0 7px 0 rgba(53,37,45,.28);padding:12px 18px 12px;display:none;pointer-events:auto;transition:opacity .15s,transform .15s}
#tray.on{display:block}
.dragging #tray{opacity:0;pointer-events:none;transform:translateY(40px)}
#tray .tt{font-size:24px;font-weight:600;margin:0 6px 8px}
#tray .tt small{font-weight:500;color:#8d99ae;margin-left:10px;font-size:20px}
#tray .row{display:flex;gap:10px;align-items:center}
#tray .scroll{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;padding-bottom:6px;scrollbar-width:thin}
.slot{flex:0 0 auto;width:114px;height:126px;border-radius:20px;background:#f3eefb;border:3px solid #35252d;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;pointer-events:auto}
.slot .th{width:94px;height:86px;pointer-events:none}
.slot em{font-style:normal;font-size:15px;font-weight:600;color:#6b6475;max-width:106px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.slot:active{background:#e3d9f7}
.slot.lock .th{filter:grayscale(1) opacity(.4)}
.slot .lk{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:1px;background:#fff;border-radius:14px;padding:2px 9px 2px 3px;font-size:18px;font-weight:700;pointer-events:none}
.slot .lk svg{width:24px;height:24px}
.slot.big{width:200px;height:210px;background:#fff7d6;cursor:default}
.slot.big .th{width:160px;height:150px}
.slot.big em{font-size:22px;max-width:190px;color:#2a1f3d}
.empty{font-size:22px;color:#8d99ae;padding:34px 20px}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tab{height:44px;padding:0 20px;border-radius:22px;background:#efe9fb;border:3px solid #35252d;font-size:21px;font-weight:600;color:#6b6475}
.tab.on{background:#6c63ff;color:#fff}
.swt{flex:0 0 auto;width:43px;height:43px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(30,10,60,.13);position:relative;transition:transform .1s}
.swt.on{box-shadow:0 0 0 3px #fff,0 0 0 7px #2a1f3d;transform:scale(1.06)}
.swt.rnd{background:conic-gradient(#ff5c7a,#ffd23f,#56d39a,#7ad3ff,#9b6bff,#ff5c7a)}
.swt.rnd svg{width:27px;height:27px;position:absolute;left:8px;top:8px}
#tray .sw{gap:8px;padding:4px 6px}
#tray .pats{margin-top:12px;gap:8px;padding:0 6px 4px}
#tray .pats span{font-size:20px;font-weight:600;margin:0 4px 0 6px}
.patb{width:50px;height:50px;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(30,10,60,.13);flex:0 0 auto;position:relative}
.patb svg{width:100%;height:100%;display:block}
.patb.on{box-shadow:0 0 0 3px #fff,0 0 0 7px #2a1f3d}
#stylep{position:absolute;left:124px;top:124px;width:338px;background:#fff;border:3.5px solid #35252d;border-radius:30px;padding:16px 18px;box-shadow:0 7px 0 rgba(53,37,45,.28);display:none;pointer-events:auto}
#stylep.on{display:block}
#stylep h3{margin:0 0 8px;font-size:30px;text-align:center;color:#ff5c7a}
.srow{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.srow button{width:56px;height:56px;border-radius:50%;background:#6c63ff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(30,10,60,.2)}
.srow button:active{transform:translateY(3px);box-shadow:none}
.srow button svg{width:32px;height:32px}
.srow span{font-size:25px;font-weight:600}
.lbl{font-size:19px;font-weight:600;color:#8d99ae;margin:10px 0 6px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sws .swt{width:40px;height:40px}
.srow2{display:flex;gap:8px;margin-top:14px;align-items:center}

/* ---------- pop-ups ---------- */
.btn{display:inline-block;height:68px;padding:0 34px;border-radius:34px;background:#6c63ff;border:3.5px solid #35252d;color:#fff;font-size:28px;font-weight:700;box-shadow:0 5px 0 rgba(53,37,45,.3);pointer-events:auto}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,10,60,.22)}
.btn.warn{background:#ff8fb1}
.btn.tog{background:#2bb7a3}
.btn.sm{height:50px;padding:0 13px;font-size:19px;background:#efe9fb;color:#6b6475;box-shadow:none;border-width:3px}
.btn.sm.on{background:#ffd23f;color:#2a1f3d}
.btn.sm.dice svg{width:30px;height:30px;vertical-align:middle}
#modal{background:rgba(42,31,61,.5);align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .card{position:relative;background:#fff;border:4px solid #35252d;border-radius:40px;padding:34px 46px;max-width:1260px;min-width:540px;max-height:810px;box-shadow:0 10px 0 rgba(53,37,45,.35);text-align:center;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#modal h2{margin:0 0 14px;font-size:44px;color:#6c63ff}
.sub{font-size:26px;margin:14px 0;color:#6b6475}
.sub.sm{font-size:20px}
#modal .close{position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:#ff5c7a;border:3.5px solid #35252d;box-shadow:0 4px 0 rgba(53,37,45,.3);display:flex;align-items:center;justify-content:center}
.close svg{width:36px;height:36px}
.tips{text-align:left;font-size:27px;line-height:1.55;margin:0 0 22px;padding-left:30px;max-width:920px}
.tips b{color:#ff5c7a}
.opts{display:flex;flex-direction:column;gap:14px;min-width:470px}
.giftbox{width:260px;height:260px;margin:10px auto;cursor:pointer;animation:gbob 1.2s ease-in-out infinite}
.giftbox svg{width:100%;height:100%}
.giftbox.shk{animation:shake .4s}
@keyframes gbob{50%{transform:translateY(-12px) rotate(-3deg)}}
.rew{display:flex;gap:18px;justify-content:center}
.streak{display:flex;gap:10px;justify-content:center;margin:10px 0}
.streak i{width:50px;height:50px;border-radius:50%;background:#efe9fb;font-style:normal;font-size:24px;font-weight:700;line-height:50px;color:#b7b0c6}
.streak i.on{background:#ffd23f;color:#2a1f3d}
.streak i svg{width:34px;height:34px;margin-top:8px}
.note{font-size:34px;font-weight:600;color:#8a5a44;background:#fff6e0;border-radius:22px;padding:26px 34px;max-width:780px;margin:10px auto}
.scope{width:340px;height:340px;margin:0 auto 12px;border-radius:50%;border:14px solid #ffd23f;overflow:hidden}
.scope svg{width:100%;height:100%;display:block}
#modal.book .card{width:1260px;height:800px;padding:26px 30px;display:flex;flex-direction:column;text-align:left}
.mh{display:flex;align-items:center;gap:34px;margin-bottom:12px;padding-right:40px}
.mh .big{display:flex;align-items:center;gap:8px;font-size:46px;font-weight:700}
.mh .big svg{width:62px;height:62px}
.mh .big span{font-size:26px;font-weight:600;color:#8d99ae}
.nx{flex:1}
.nx .bar{height:22px;border-radius:11px;background:#efe9fb;overflow:hidden;margin-bottom:4px}
.nx .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd23f,#ff8552);border-radius:11px}
.nx span{font-size:21px;color:#6b6475}
#modal .body{flex:1;overflow-y:auto;touch-action:pan-y;padding-right:8px;-webkit-overflow-scrolling:touch}
#modal h4{font-size:25px;margin:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stk{border-radius:18px;background:#f3eefb;padding:10px 12px;min-height:86px;display:flex;align-items:center;gap:10px}
.stk svg{width:46px;height:46px;flex:0 0 auto}
.stk.got{background:#fff7d6;background:color-mix(in srgb,var(--c) 17%,#fff)}
.stk b{font-size:20px;line-height:1.15}
.stk .q{width:40px;height:40px;border-radius:50%;background:#d9d2e9;color:#fff;font-size:26px;font-weight:700;line-height:40px;text-align:center;flex:0 0 auto}
.stk small{font-size:15px;line-height:1.2;color:#8d99ae}
.grid.pets{grid-template-columns:repeat(6,1fr)}
.pcard{border-radius:20px;background:#f3eefb;padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center}
.pcard .th{width:112px;height:98px}
.pcard:not(.got) .th{filter:brightness(0) opacity(.16)}
.pcard.got{background:#fff7d6}
.pcard b{font-size:20px}
.pcard small{font-size:14px;color:#8d99ae;line-height:1.2}
#toasts{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 0 420px}
.toast{background:#35252d;color:#fff;font-size:26px;font-weight:600;padding:14px 30px;border-radius:30px;box-shadow:0 6px 0 rgba(30,10,60,.25);animation:tin .35s cubic-bezier(.3,1.5,.5,1);max-width:760px;text-align:center;line-height:1.2;transition:opacity .35s,transform .35s}
.toast.out{opacity:0;transform:translateY(-20px)}
.toast.stk{background:#fff;border:3.5px solid #35252d;color:#2a1f3d;display:flex;align-items:center;gap:12px;padding:10px 32px 10px 14px}
.toast.stk svg{width:58px;height:58px;animation:spin 1s ease-out}
.toast.stk span{display:flex;flex-direction:column;text-align:left;font-size:28px;line-height:1.1}
.toast.stk small{font-size:17px;color:#ff8552;font-weight:700;text-transform:uppercase;letter-spacing:1px}
@keyframes tin{from{transform:translateY(-40px) scale(.6);opacity:0}}

/* ---------- map ---------- */
#map.on{display:block}
#map>svg{display:block;position:absolute;left:0;top:0}
.spot{cursor:pointer}
.spot .sp-in{transition:transform .15s;transform-box:fill-box;transform-origin:50% 100%}
.spot:hover .sp-in{transform:scale(1.07)}
.spot:active .sp-in{transform:scale(.95)}
.spot.locked .sp-in{filter:grayscale(.85) opacity(.8)}
.mlabel{position:absolute;transform:translateX(-50%);background:#fff;border:3px solid #35252d;border-radius:22px;padding:3px 16px;font-size:23px;font-weight:600;box-shadow:0 4px 0 rgba(53,37,45,.25);white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:5px}
.mlabel svg{width:26px;height:26px}
.mlabel.lk{background:#efe9fb;color:#6b6475}
.mtitle{position:absolute;left:34px;top:18px;font-size:60px;font-weight:700;color:#fff;-webkit-text-stroke:6px #35252d;paint-order:stroke fill;letter-spacing:1px;pointer-events:none}
.gbal{position:absolute;left:800px;top:36px;width:150px;height:240px;pointer-events:auto;animation:gfloat 4s ease-in-out infinite}
.gbal svg{width:150px;height:238px;display:block;filter:grayscale(.9) opacity(.55)}
.gbal.ready svg{filter:none}
.gbal span{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);background:#fff;border:3px solid #35252d;border-radius:18px;padding:2px 14px;font-size:22px;font-weight:700;box-shadow:0 4px 0 rgba(30,10,60,.16);white-space:nowrap;color:#8d99ae}
.gbal.ready span{background:#ff5c7a;color:#fff;animation:pulse 1s infinite}
.gbal:not(.ready) .gf{display:none}
@keyframes gfloat{50%{transform:translate(14px,-18px)}}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.14)}}
.wv{animation:wv 3s ease-in-out infinite}
@keyframes wv{50%{transform:translateX(14px)}}
.mcloud{animation:mcloud 70s linear infinite}
@keyframes mcloud{from{transform:translateX(0)}to{transform:translateX(2100px)}}
.bobm{animation:bobm 3s ease-in-out infinite}
@keyframes bobm{50%{transform:translateY(-8px)}}
.whale{cursor:pointer}
.whale.hi .bobm{animation:hop .5s 2}

/* ---------- title ---------- */
#title{background:linear-gradient(#8fe3ff,#c9f2ff 60%,#ffe9a8);flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#title.on{display:flex}
#title.out{opacity:0;pointer-events:none}
.tsky{position:absolute;left:0;top:0;width:100%;height:100%}
.logo{position:relative;font-size:210px;font-weight:700;line-height:1;display:flex;margin-top:-30px;filter:drop-shadow(0 9px 0 rgba(53,37,45,.3))}
.logo i{font-style:normal;display:inline-block;animation:lbob 1.6s ease-in-out infinite;-webkit-text-stroke:9px #35252d;paint-order:stroke fill}
.logo .sp{width:64px}
@keyframes lbob{50%{transform:translateY(-16px) rotate(-3deg)}}
.tag{position:relative;font-size:34px;font-weight:600;color:#4a4e69;margin:4px 0 0}
.tchars{position:relative;display:flex;align-items:flex-end;gap:8px;height:280px;margin-top:4px}
.tf .th{width:150px;height:250px;display:block}
.tf.big .th{width:172px;height:284px}
.tf.p .th{width:124px;height:124px}
.btn.play{position:relative;height:104px;padding:0 96px;font-size:52px;border-radius:52px;background:#ff5c7a;margin-top:8px;animation:pulse2 1.4s infinite}
@keyframes pulse2{50%{transform:scale(1.06)}}
#rot{display:none;position:fixed;left:0;right:0;bottom:0;padding:12px;text-align:center;color:#fff;font-size:16px;font-weight:600;background:rgba(42,31,61,.7);z-index:5}
@media (orientation:portrait) and (max-width:820px){#rot{display:block}}

/* ---------- play together ---------- */
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
#b-net{right:22px;top:132px}
#b-net.wait{background:#fff3a8;animation:netw 1.2s ease-in-out infinite}
#b-net.act{background:#b8e986}
#b-net.act::after{content:'2';position:absolute;right:-8px;top:-8px;width:36px;height:36px;border-radius:50%;background:#56d39a;border:3px solid #35252d;color:#fff;font-size:22px;font-weight:700;line-height:30px;text-align:center}
@keyframes netw{50%{transform:scale(1.08)}}
#modal .card.still{animation:none}
#modal.net .card{width:820px}
.rcode{display:flex;gap:12px;justify-content:center;margin:18px 0}
.rcode i{width:92px;height:112px;border-radius:22px;background:#fff6e0;border:4px solid #35252d;box-shadow:0 6px 0 rgba(53,37,45,.25);font-style:normal;font-size:72px;font-weight:700;line-height:104px;color:#ff5c7a;-webkit-user-select:text;user-select:text}
.rcode i:nth-child(2){color:#ff8552}.rcode i:nth-child(3){color:#2bb7a3}.rcode i:nth-child(4){color:#4a90e2}.rcode i:nth-child(5){color:#9b6bff}
.nbtns{display:flex;flex-direction:column;align-items:center;gap:20px;margin:22px 0 10px}
.nbtns .btn{height:84px;font-size:34px;padding:0 48px;border-radius:42px}
.njoin{display:flex;gap:12px;align-items:center}
.njoin::before{content:'or';font-size:26px;color:#6b6475;margin-right:6px}
.njoin input{width:290px;height:84px;border-radius:26px;border:4px solid #35252d;background:#fff6e0;font-size:46px;font-weight:700;letter-spacing:10px;text-align:center;text-transform:uppercase;outline:none;color:#2a1f3d;padding:0 0 0 10px}
.njoin input::placeholder{color:#d8cbb4;letter-spacing:6px}
.njoin input:focus{border-color:#6c63ff;background:#fff}
.sub.wait{animation:netw 1.4s ease-in-out infinite}
#rcur{position:absolute;left:0;top:0;width:64px;height:64px;margin:-10px 0 0 -22px;z-index:95;pointer-events:none;display:none;transition:transform .09s linear;filter:drop-shadow(0 4px 0 rgba(53,37,45,.25))}
#rcur svg{width:100%;height:100%}

/* ---------- me, my friend, and things for two ---------- */
.avtag{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);padding:1px 13px 2px;border-radius:14px;border:3px solid #35252d;font-size:19px;font-weight:700;letter-spacing:1px;line-height:1.15;white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(53,37,45,.25);color:#35252d}
.avtag.me{background:#ffd23f}
.avtag.fr{background:#8fd3ff}
.ent.lie .avtag{display:none}
.tf{position:relative}.tf .avtag{bottom:-4px;font-size:22px}
.visitor #b-paint{display:none!important}
.mlabel.mine{background:#ffd23f}
.ent.rocking>.in{animation:rock 1.3s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
#modal.mewin .card{width:1000px}
.mepick{display:flex;gap:34px;align-items:center;justify-content:center;margin:4px 0 2px}
.mefig{position:relative;width:300px;height:410px;background:#fff6e0;border:4px solid #35252d;border-radius:34px;display:flex;align-items:center;justify-content:center}
.mefig .th{width:236px;height:360px;display:block}
.mefig .avtag{bottom:12px;font-size:24px}
.mectl{width:384px;text-align:left}
.mectl .srow{display:flex;align-items:center;justify-content:space-between;margin:6px 0;font-size:24px;font-weight:600}
.mectl .lbl{font-size:20px;font-weight:600;color:#6b6475;margin:8px 0 4px}
.mectl .sws{display:flex;flex-wrap:wrap;gap:8px}
.hbrush{position:absolute;width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid #35252d;box-shadow:0 4px 0 rgba(53,37,45,.25);display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:transform .1s}
.hbrush:active{transform:scale(.9)}
.hbrush svg{width:34px;height:34px}
.mefig.hfig{width:440px;height:340px}
.mefig.hfig svg{width:400px;height:300px;display:block}
.mfr{position:absolute;transform:translateX(-50%);background:#8fd3ff;border:3px solid #35252d;border-radius:18px;padding:2px 12px 2px 8px;font-size:20px;font-weight:700;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:5px;box-shadow:0 4px 0 rgba(53,37,45,.25);animation:mfr 1.6s ease-in-out infinite;z-index:2}
@keyframes mfr{50%{transform:translate(-50%,-7px)}}
.mfr svg{width:26px;height:26px}
/* ---------- Christmas ---------- */
#xbox{position:absolute;right:164px;bottom:26px;width:100px;height:100px;pointer-events:auto;cursor:pointer;display:none;transition:transform .15s;z-index:3}
#xbox svg{width:100%;height:100%;filter:drop-shadow(0 5px 0 rgba(30,10,60,.18));overflow:visible}
#xbox .badge{position:absolute;right:-6px;top:-2px;min-width:38px;height:38px;border-radius:19px;background:#e63946;color:#fff;font-size:21px;font-weight:700;line-height:38px;text-align:center;padding:0 7px;box-shadow:0 3px 0 rgba(30,10,60,.2)}
.hasx #xbox{display:block}.onmap #xbox{display:none!important}
#xbox.open{transform:scale(1.22)}
#xbox.act svg{filter:drop-shadow(0 0 0 #ffd23f) drop-shadow(0 6px 0 rgba(30,10,60,.18))}
.hasx #tray{right:284px}
#b-xmas{left:22px;top:132px;display:none}
.xmas.onmap #b-xmas{display:flex}
#b-xmas b{position:absolute;right:-10px;top:-10px;min-width:40px;height:40px;border-radius:20px;background:#e63946;border:3px solid #35252d;color:#fff;font-size:21px;font-weight:700;line-height:34px;text-align:center}
#b-xmas.ready{animation:netw 1.1s ease-in-out infinite;background:#fff3a8}
#snow{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none;z-index:40;overflow:hidden}
.xmas.onmap #snow,.xmas.out #snow{display:block}
#snow i{position:absolute;top:-20px;border-radius:50%;background:#fff;opacity:.9;box-shadow:0 0 0 2px rgba(120,170,220,.25);animation:snowf linear infinite}
@keyframes snowf{to{transform:translate(60px,940px)}}
#modal.xwin .card{width:1180px;height:auto;display:block;text-align:center}
.xcal{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-top:10px}
.xdoor{height:112px;border-radius:18px;background:#e9e4f5;border:3.5px solid #35252d;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a79fb8;box-shadow:0 4px 0 rgba(53,37,45,.2)}
.xdoor b{font-size:40px;line-height:1}.xdoor small{font-size:17px;font-weight:600}
.xdoor.can{background:#e63946;color:#fff}.xdoor.can:active{transform:translateY(3px)}
.xdoor.today{animation:netw 1.1s ease-in-out infinite;background:#2bb673;color:#fff}
.xdoor.got{background:#fff6e0;box-shadow:none}
.xdoor .th{width:84px;height:92px;display:block}
.swt.xoff{background:#efe9fb;display:flex;align-items:center;justify-content:center}.swt.xoff svg{width:22px;height:22px;filter:invert(.55)}

</style>
</head>
<body>
<div id="stage">
 <div id="bg"></div><div id="ents"></div><div id="night"></div><div id="party"></div><div id="lights"></div>
 <div id="map" class="ui"></div>
 <div id="hud">
  <button id="b-map" class="ui rb" aria-label="Map"></button><div id="topbar"><button id="nav-l" class="ui nav"></button><div id="sname"></div><button id="nav-r" class="ui nav"></button></div>
  <button id="b-stars" class="ui" aria-label="Sticker book"></button><button id="b-set" class="ui rb" aria-label="Settings"></button><button id="b-net" class="ui rb" aria-label="Play together"></button>
  <button id="b-paint" class="ui rb" aria-label="Paint"></button><button id="b-cat" class="ui rb" aria-label="Furniture catalog"></button>
  <div id="trash" class="ui"></div><div id="tray" class="ui"></div><div id="pack" class="ui"></div><div id="xbox" class="ui"></div><button id="b-xmas" class="ui rb" aria-label="Christmas calendar"></button><div id="stylep" class="ui"></div>
 </div>
 <div id="snow"></div><div id="modal" class="ui"></div><div id="fx"></div><div id="toasts"></div><div id="title" class="ui"></div>
</div>
<div id="rot">Turn your device sideways for a bigger view!</div>

 const inn=h('div','in');inn.appendChild(h('div','g'));if(d.front){inn.appendChild(h('div','kids k1'));inn.appendChild(h('div','f'))}inn.appendChild(h('div','kids k2'));el.appendChild(inn);

function moveAnim(e,mut,an,done){const el=EL.get(e.id);if(!el){mut();done&&done();return}

function landFx(e,an){if(!byId(e.id))return;const d=TD(e);if(an==='fall'){anim(e,d.bouncy?'bounce':'land',d.bouncy?600:240);const p=e.par&&byId(e.par);

function unpar(e){if(!e.par)return;const a=absXY(e),p=byId(e.par),sl=e.slot,el=EL.get(e.id);e.par=null;e.slot=null;e.x=a.x;e.y=a.y;delete e.dx;delete e.dy;

 posE(e);if(p){const pd=TD(p);if(pd.lost)pd.lost(p,e,sl)}}
function attach(e,p,slot,dx,dy,an){if(e.par)unpar(e);const el=EL.get(e.id);an=an||'go';
 moveAnim(e,()=>{e.par=p.id;e.slot=slot;e.dx=dx;e.dy=dy;kbox(p,slot).appendChild(el);el.classList.toggle('sm',isSm(p,slot));el.classList.toggle('hd',isHd(p,slot));el.classList.toggle('bob',!!TD(p).water&&slot==='surf')},an,()=>landFx(e,an));dirty()}

function glide(e,x,y,ms,done){const el=EL.get(e.id),sid=SID;e.x=x;e.y=y;if(!el)return;el.style.transition=`transform ${ms}ms ease-in-out`;posE(e);const tok=el._mt=(el._mt||0)+1;
 setTimeout(()=>{if(el._mt===tok)el.style.transition='';if(SID===sid&&byId(e.id)&&done)done()},ms+30);dirty()}
function surfaces(ex){const out=[];for(const e of S.ents){const d=TD(e);if(!d.surf||ex.has(e.id)||(e.slot&&e.slot!=='surf'))continue;const a=absXY(e),f=e.flip?-1:1;
  for(const s of d.surf)out.push({x1:a.x+(f>0?s[0]:-s[1]),x2:a.x+(f>0?s[1]:-s[0]),y:a.y+s[2],o:e})}return out}
function findRest(e,x,y){const sc=SC[SID],[ft,fb]=sc.floor,sfs=surfaces(subIds(e)).filter(s=>x>=s.x1-12&&x<=s.x2+12);let best=null;
 for(const s of sfs){const dy=s.y-y;if(dy>=-46&&dy<=44&&(!best||Math.abs(dy)<Math.abs(best.y-y)))best=s}
 if(best)return best;
 if(y>=ft-6)return{y:clamp(y,ft+6,fb),o:null};
 for(const s of sfs)if(s.y>=y&&(!best||s.y<best.y))best=s;
 const fy=ft+(sc.land||56);return best&&best.y<fy+40?best:{y:fy,o:null}}
function place(e){const d=TD(e),sc=SC[SID],[ft,fb]=sc.floor,x=clamp(e.x,Math.min(d.w*.3,90),W-Math.min(d.w*.3,90)),y=e.y;
 if(d.mt==='wall'){e.zz=S.zc=(S.zc||0)+1;setFree(e,x,clamp(y,d.h+10,ft-36),'put');return}
 if(d.mt==='rug'){setFree(e,x,clamp(y,ft+d.h*.45,fb+24),'put');return}
 if(d.float){setFree(e,x,d.h+rnd(14,60),'float');return}
 if((d.k==='furn'&&!d.tt)||d.k==='fix'){setFree(e,x,y<ft?ft+(sc.land||56):Math.min(y,fb),'fall');return}

 if(r.o){const a=absXY(r.o);attach(e,r.o,'surf',clamp(x,r.x1+6,r.x2-6)-a.x,r.y-a.y,'fall')}else setFree(e,x,r.y,'fall')}

/* ---------- people & pets: holding, wearing, eating, sleeping ---------- */
function chSlot(ch,slot,it){const s=ch.s.pose==='sit'?42:0,d=TD(it);
 if(slot==='head')return{dx:0,dy:-197+s+((d.hat&&d.hat.dy)||0)};
 if(slot==='handL')return{dx:-46,dy:-62+s+d.h/2};
 if(slot==='handR')return{dx:46,dy:-62+s+d.h/2};
 return{dx:0,dy:-134+s+d.h/2}}
function reslot(ch){for(const k of kidsOf(ch))if(['head','handL','handR'].includes(k.slot)){const sl=chSlot(ch,k.slot,k);k.dx=sl.dx;k.dy=sl.dy;posE(k)}}
function dropAll(w){for(const k of kidsOf(w)){unpar(k);k.x+=rnd(-90,90);place(k)}}
function hold(ch,it,slot){const other=slot==='handL'?'handR':'handL';if(kidIn(ch,slot)){if(!kidIn(ch,other))slot=other;else{const old=kidIn(ch,slot);unpar(old);old.x+=slot==='handL'?-80:80;place(old)}}
 const sl=chSlot(ch,slot,it);attach(it,ch,slot,sl.dx,sl.dy,'go');sfx.pop()}
function wear(who,hat){const old=kidIn(who,'head'),isCh=TD(who).k==='char';if(old){unpar(old);old.x+=pick([-1,1])*rnd(60,100);place(old)}
 const sl=isCh?chSlot(who,'head',hat):{dx:0,dy:-72};attach(hat,who,'head',sl.dx,sl.dy,'go');sfx.pop();star(isCh?'hat':'pethat')}
function sleepOn(bed,ch,i){dropAll(ch);const b=TD(bed).bed[i];ch.s.pose='sleep';redraw(ch);attach(ch,bed,'sleep'+i,b[0],b[1],'fall');star('sleep');sfx.magic()}
function tryAccept(x,e,p){const d=TD(x),k=TD(e).k;

 if(k==='pet'&&x.t==='petbed')return false;
 if(k==='char'){
  if(d.bed){const a=absXY(x);let best=-1,bd=1e9;d.bed.forEach((b,i)=>{if(kidIn(x,'sleep'+i))return;const dd=Math.abs(a.x+b[0]-p.x);if(dd<bd){bd=dd;best=i}});if(best>=0){sleepOn(x,e,best);return true}}
  if(d.seats){const fl=x.flip?-1:1,a=absXY(x);let best=-1,bd=1e9;d.seats.forEach((s,i)=>{if(kidIn(x,'seat'+i))return;const dd=Math.abs(a.x+s[0]*fl-p.x);if(dd<bd){bd=dd;best=i}});
   if(best>=0){const s=d.seats[best];e.s.pose='sit';redraw(e);reslot(e);attach(e,x,'seat'+best,s[0]*fl,s[1],'fall');star('sit');if(d.sat)d.sat(x,e);return true}}}
 return false}
function eat(who,it){const d=TD(it),isCh=TD(who).k==='char',sid=SID,ok=()=>SID===sid&&byId(who.id)&&byId(it.id);
 if(d.k==='drink'&&!it.s.fill){say(who,'It\'s empty!');if(isCh)hold(who,it,'handR');else place(it);return}
 tr(who).busy=tr(it).busy=1;if(who.me&&NET.peer&&who.me!==actNo())star('share');const sl=isCh?chSlot(who,'mouth',it):{dx:0,dy:-44+d.h/2};attach(it,who,'mouth',sl.dx,sl.dy,'go');setFace(who,isCh?'chew':'yum',1500);
 const fin=()=>{tr(who).busy=0;if(!ok())return;const r=reaction(who,it);
  if(d.k==='drink'){tr(it).busy=0;const cream=it.s.cream;Object.assign(it.s,{fill:0,boba:0,cream:0,rb:0,fx:null,nm:null});redraw(it);

  else rm(it);
  doReact(who,r)};

function onDown(ev){if(ev.button>0)return;ac();if(!S||ev.target.closest('.ui'))return;
 const el=ev.target.closest('.ent'),e=el?byId(+el.dataset.id):null,p=spt(ev);
 PTR.set(ev.pointerId,{e,p0:p,p,tg:ev.target,bg:!!ev.target.closest('#bg'),drag:false,cx:ev.clientX,cy:ev.clientY});try{$stage.setPointerCapture(ev.pointerId)}catch(_){}ev.preventDefault()}
function onMove(ev){const P=PTR.get(ev.pointerId);if(!P)return;P.p=spt(ev);P.cx=ev.clientX;P.cy=ev.clientY;if(P.dead)return;const g=NET.mir;
 if(!P.drag){if(Math.hypot(P.p.x-P.p0.x,P.p.y-P.p0.y)<10)return;if(MODE==='paint'||!P.e||!(g?gGrab(P):startDrag(P))){P.dead=true;return}}
 if(g)gMove(P);else dragMove(P)}
function onUp(ev){const P=PTR.get(ev.pointerId);if(!P)return;PTR.delete(ev.pointerId);P.p=spt(ev);P.cx=ev.clientX;P.cy=ev.clientY;
 if(!S)return;const cancel=ev.type==='pointercancel';
 if(NET.mir){ // I am watching my friend's copy of this place: tell them what my hands did
  if(P.drag)gDrop(P,cancel);else if(!P.dead&&!cancel){const r=resolveTap(P);if(MODE==='paint')NET.send({t:'tap',r,col:paintCol()});else if(r.id!=null)NET.send({t:'tap',r})}return}
 if(P.drag)endDrag(P,cancel);else if(!P.dead&&!cancel)tapAt(P)}
function startDrag(P){let e=P.e;if(!byId(e.id))return false;const d=TD(e);if(tr(e).busy||tr(e).drag)return false;
 let o=P.p0;if(isFix(e)){if(!d.disp)return false;const n=dispense(e,P.p);if(!n)return false;e=P.e=n;o=P.p}else if(!mayMove(e,myNo())){shy(e);return false}
 if(e.par)unpar(e);P.off={x:e.x-o.x,y:e.y-o.y};beginDrag(P);return true}

 const now=performance.now();if(now-(P.ht||0)>70){P.ht=now;hover(P)}if(S.night&&TD(e).light)updLights()}
function hover(P){const e=P.e,k=TD(e).k;$pack.classList.toggle('open',over($pack,P));$trash.classList.toggle('open',over($trash,P));if($xbox)$xbox.classList.toggle('open',over($xbox,P));let tg=null;
 if(k==='food'||k==='drink'){const ex=subIds(e);for(const n of document.elementsFromPoint(P.cx,P.cy)){const en=n.closest&&n.closest('.ent');if(!en)continue;let x=byId(+en.dataset.id);if(!x||ex.has(x.id))continue;
   while(x&&TD(x).k!=='char')x=x.par?byId(x.par):null;if(x){tg=x;break}}}
 if(P.hv!==tg){unHover(P);P.hv=tg;if(tg&&!tr(tg).busy&&tg.s.pose!=='sleep'){tr(tg).face='open';redraw(tg)}}}

/* Dropping and tapping are split in two: "resolve" looks at what is under the finger (on whichever screen
   the finger is on), and "core" makes it happen in the world. In two-player mode the visiting friend
   resolves on their own screen and the host runs the core. */
function resolveDrop(P,e){const res={pack:over($pack,P),trash:over($trash,P),xbox:over($xbox,P),ids:[]};if(res.pack||res.trash||res.xbox)return res;
 const ex=e?subIds(e):new Set(),seen=new Set();
 for(const n of document.elementsFromPoint(P.cx,P.cy)){const en=n.closest&&n.closest('.ent');if(!en)continue;let x=byId(+en.dataset.id);
  while(x){if(!ex.has(x.id)&&!seen.has(x.id)){seen.add(x.id);res.ids.push(x.id)}x=x.par?byId(x.par):null}}
 return res}
function dropCore(e,p,res,cancel){const el=EL.get(e.id);if(!el||!byId(e.id))return;el.classList.remove('drag');tr(e).drag=0;posE(e);
 if(!cancel&&res){
  if(res.pack){stash(e);return}
  if(res.xbox){stash(e,1);return}
  if(res.trash){trashE(e);return}
  const ex=subIds(e);for(const id of res.ids){const x=byId(id);if(x&&!ex.has(id)&&tryAccept(x,e,p))return}
  if(TD(e).k==='char')for(const x of S.ents){const d=TD(x);if(!d.mag||ex.has(x.id))continue;const a=absXY(x),fl=x.flip?-1:1; // seats that are easy to miss pull a friend in
   if(d.seats.some((s,i)=>!kidIn(x,'seat'+i)&&Math.abs(a.x+s[0]*fl-p.x)<84&&p.y>a.y+s[1]-200&&p.y<a.y+s[1]+50)&&tryAccept(x,e,p))return}}
 place(e)}

function resolveTap(P){const tg=P.tg,c=s=>tg&&tg.closest?tg.closest(s):null,b=c('[data-b]'),pt=c('[data-p]');
 return{id:P.e?P.e.id:null,b:b?b.dataset.b:null,part:pt?pt.dataset.p:null,bg:!!P.bg,p:{x:Math.round(P.p.x),y:Math.round(P.p.y)}}}
function tapAt(P){const r=resolveTap(P);if(MODE==='paint')paintCore(r,paintCol());else tapCore(r)}
function tapCore(r){const e=r.id!=null?byId(r.id):null;if(!e)return;const d=TD(e),tg={closest:s=>s==='[data-b]'&&r.b!=null?{dataset:{b:r.b}}:null};

 else if(d.k==='furn'&&!isFix(e)&&!kidsOf(e).length&&!e.par){if(!canDeco(actNo())){shy(e);return}e.flip=!e.flip;redraw(e);anim(e,'land',240);sfx.boing();dirty()}
 else{anim(e,'wig',320);sfx.pop()}}

 const a=absXY(e);let n;if(pt)n=spawn(g.t,pt.x,pt.y+T[g.t].h/2,g.o);else{n=popOut(g.t,a.x+rnd(-20,20),a.y-d.h*.55,g.o,pick([-1,1])*rnd(80,160));sfx.pop();anim(e,'land',240)}
 if(d.after)d.after(e);return n}

/* =====================================================================
   ME & FRIENDS — every player has one character that is "them".
   It wears a little ME tag and comes along wherever you go.
   In a two-player game avatar 1 is the host and avatar 2 is the friend;
   each player keeps their own home, and Buddy Island opens up.
   ===================================================================== */
const myNo=()=>NET.role==='guest'?2:1;          // which avatar is mine (1 = whoever started the room, 2 = the friend who joined)
const actNo=()=>ACTOR?3-myNo():myNo();          // who is doing the thing that is happening right now
const isAv=e=>e.t==='char'&&(e.me===1||e.me===2);
const clone=o=>JSON.parse(JSON.stringify(o));
/* an entity plus everything it wears / holds, inside a list of entities */
function grpOf(root,ents){const out=[root];for(let i=0;i<out.length;i++)for(const k of ents)if(k.par===out[i].id&&!out.includes(k))out.push(k);return out}
function grpPull(root,ents){const g=grpOf(root,ents);for(const k of g){const i=ents.indexOf(k);if(i>=0)ents.splice(i,1)}root.par=null;root.slot=null;delete root.dx;delete root.dy;if(root.t==='char'){root.s.pose='stand';delete root.s.lie}return g}
/* give a list of entities brand-new ids from this save (used whenever things cross from one player to the other) */
function reid(arr){const m=new Map();for(const e of arr){m.set(e.id,G.nid);e.id=G.nid++}
 for(const e of arr)if(e.par!=null){if(m.has(e.par))e.par=m.get(e.par);else{e.par=null;e.slot=null;delete e.dx;delete e.dy;if(!e.x){e.x=800;e.y=760}}}return arr}

/* ---------- my avatar ---------- */
function avMake(){const e=mk('char',0,0,Object.assign({},CH.me,{me:myNo()})),hat=mk('hat',0,0,{s:{v:2}}),sl=chSlot(e,'head',hat);hat.par=e.id;hat.slot='head';hat.dx=sl.dx;hat.dy=sl.dy;return[e,hat]}
function avFind(){const no=myNo(); // where is my own avatar right now?
 if(G.trav&&G.trav.length&&T[G.trav[0].t])return{e:G.trav[0],ents:G.trav,at:'trav'};
 if(S&&!NET.mir){const e=S.ents.find(x=>isAv(x)&&x.me===no);if(e)return{e,ents:S.ents,at:'here'}}
 for(const id in G.sc){const sc=G.sc[id];if(!sc||sc===S||!sc.ents)continue;const e=sc.ents.find(x=>isAv(x)&&x.me===no);if(e)return{e,ents:sc.ents,at:'away'}}
 for(const a of G.pack)if(a[0]&&isAv(a[0])&&a[0].me===no)return{e:a[0],ents:a,at:'pack'};
 return null}
function avEnsure(){if(avFind()||NET.mir)return; // older saved games: the girl in the living room becomes "me"; new games: make one
 if(G.avb&&G.avb.length&&T[G.avb[0].t]){G.trav=reid(clone(G.avb));G.trav[0].me=myNo();G.trav[0].par=null;G.trav[0].slot=null}
 else{const hm=G.sc.home&&G.sc.home.ents,like=(e,k)=>e.s.hs===CH[k].s.hs&&e.s.of===CH[k].s.of&&e.c.b===CH[k].c.b,
   sc=e=>(like(e,'me')?4:0)+(hm.some(k=>k.par===e.id&&k.t==='hat'&&k.s.v===2)?2:0)+(like(e,'bro')?0:1), // the girl with the bow, however she has been restyled
   c=hm&&hm.filter(e=>e.t==='char'&&!e.me).sort((x,y)=>sc(y)-sc(x))[0];if(c)c.me=myNo();else G.trav=avMake()}
 delete G.avb;dirty()}
function avTidy(mine){ // my saved game keeps only my own avatar (a visiting friend never stays), and forgets who brought what
 const fix=ents=>{for(const e of ents.filter(x=>isAv(x)&&x.me!==mine))grpPull(e,ents);for(const e of ents){if(isAv(e))e.me=1;delete e.ow;delete e.fre;delete e._t}};
 for(const id in G.sc){const sc=G.sc[id];if(sc&&sc.ents)fix(sc.ents)}
 G.pack=G.pack.filter(a=>!(a[0]&&isAv(a[0])&&a[0].me!==mine));for(const a of G.pack)fix(a);
 if(G.trav){if(G.trav[0]&&isAv(G.trav[0])&&G.trav[0].me!==mine)G.trav=null;else fix(G.trav)}
 if(G.avb&&G.avb[0])G.avb[0].me=1;G.meNo=1}
function avTake(){if(!S)return;const e=S.ents.find(x=>isAv(x)&&x.me===myNo());if(e){const g=grpPull(e,S.ents);for(const k of g)delete k._t;G.trav=g}} // leaving a place: I come along

function whyNot(e){const hd=holder(e);if(hd&&hd!==actNo())return isAv(e)?'That\'s your friend — only they can move themselves!':'That belongs to your friend.';if(e.ow&&e.ow!==actNo())return'Your friend brought that. If they put it in your hands, it\'s yours!';return'Only the owner can redecorate or take things here. In your own house, you can!'}

/* =====================================================================
   PLAY TOGETHER — two players, joined by a room code. No sign-in, no chat.
   The two browsers talk directly to each other.

   Each player walks around the town ON THEIR OWN. You only see your friend
   when you are both in the same place.
     · The town belongs to whoever started the room (player 1). Each player
       has their own house, backpack, stars and avatar.
     · A place is always "run" by one player: whoever got there first.
       If your friend is already there, you watch their copy of it and send
       what your hands do; when they leave, you carry on running it.
     · If the place lives in your friend's saved game and they are somewhere
       else, they lend it to you and you hand it back when you leave.
   ===================================================================== */
const NETV=4;
const NET={role:null,want:null,code:'',peer:null,tr:null,last:new Map(),lastMeta:'',rp:null,drag:null,fxo:{},msg:'',inFx:0,slow:0,
 here:null,there:null,   // where I am / where my friend is (null = looking at the map)
 mir:false,              // I am watching my friend's copy of this place (they run it)
 feed:false,             // my friend is watching my copy of this place (I run it)
 pend:null,queue:null,seq:0,lent:null,ld:0,
 frStars:0,frFlags:{},frHouse:null,mirror:null,wg:null,myAv:null,avJ:'',mirDirty:0,sent:new Set(),hop:null};
let ACTOR=null; // set while I carry out something my friend's hands did in a place I am running
NET.send=(m,to)=>{if(NET.tr&&(to||NET.peer))try{NET.tr.send(m,to||NET.peer)}catch(e){}};
const WG=()=>NET.mir&&NET.wg?NET.wg:G;                              // whose daily capsules etc. a drawing should show: the player running the place
const iOwn=id=>!!SC[id]&&(SC[id].own===2)===(NET.role==='guest');   // does this place live in MY saved game?
const myKey=id=>SC[id].own===2?SC[id].base:id;                      // …and under which name
const myScene=id=>G.sc[myKey(id)]||(G.sc[myKey(id)]=initScene(myKey(id)));
const netSpot=id=>isHome(id)?(SC[id].own===2?'home2':'home'):SC[id].spot||id;    // the spot on the map that a room belongs to
const netCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s};
const hexOk=c=>typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c);
const ptOk=o=>o&&typeof o==='object'&&isFinite(o.x)&&isFinite(o.y)?{x:clamp(+o.x,-200,W+200),y:clamp(+o.y,-200,H+200)}:null;
function hushed(fn){NET.inFx++;try{return fn()}finally{NET.inFx--}} // sounds/effects that only this player should get
function usfx(k){hushed(()=>sfx[k]())}
function asActor(who,fn){const p=ACTOR;ACTOR=who;try{return fn()}finally{ACTOR=p}}

/* ---------- never trust what arrives: everything from the other player is checked before it is used ---------- */
const esc=s=>String(s).replace(/[<>&"`]/g,c=>'&#'+c.charCodeAt(0)+';');
function cleanV(v,d){if(v===null||typeof v==='boolean')return v;if(typeof v==='number')return isFinite(v)?v:0;if(typeof v==='string')return/^[^<>"`]{0,60}$/.test(v)?v:'';
 if(d>3||typeof v!=='object')return null;if(Array.isArray(v))return v.slice(0,24).map(x=>cleanV(x,d+1));const o={};let n=0;for(const k in v){if(n++>24||!/^[a-zA-Z0-9]{1,12}$/.test(k))continue;o[k]=cleanV(v[k],d+1)}return o}
function cleanE(u){if(typeof u==='string')try{u=JSON.parse(u)}catch(e){return null}
 if(!u||typeof u!=='object'||typeof u.t!=='string'||!T.hasOwnProperty(u.t)||!Number.isInteger(u.id))return null;const e={id:u.id,t:u.t,x:+u.x||0,y:+u.y||0,c:{},s:cleanV(u.s||{},0)||{}};
 if(u.c&&typeof u.c==='object')for(const k in u.c)if(/^[a-z]$/.test(k)&&typeof u.c[k]==='string'&&/^#[0-9a-fA-F]{3,8}$/.test(u.c[k]))e.c[k]=u.c[k];
 if(Number.isInteger(u.par)){e.par=u.par;e.slot=typeof u.slot==='string'&&/^[a-zA-Z]{1,8}\d{0,2}$/.test(u.slot)?u.slot:'surf';e.dx=+u.dx||0;e.dy=+u.dy||0}
 if(u.flip)e.flip=true;if(u.fx)e.fx=1;if(u.zz)e.zz=+u.zz||0;if(u.fre)e.fre=1;if(typeof u.from==='string'&&SC.hasOwnProperty(u.from))e.from=u.from;if(u.me===1||u.me===2)e.me=u.me;if(u.ow===1||u.ow===2)e.ow=u.ow;
 if(u._t&&typeof u._t==='object')e._t=cleanV(u._t,1);return e}
const cleanBg=(bg,def)=>{const o={};for(const k in def)o[k]=bg&&hexOk(bg[k])?bg[k]:def[k];return o};
const cleanHouse=h=>h&&typeof h==='object'&&hexOk(h.w)&&hexOk(h.r)?{w:h.w,r:h.r}:null;
const cleanPat=p=>({wall:clamp(+(p&&p.wall)|0,0,WPAT.length-1),floor:clamp(+(p&&p.floor)|0,0,FPAT.length-1)});
/* a whole place, as it travels between the two players (never with avatars inside) */
function scSer(st){const ents=clone(st.ents);for(const e of ents.filter(isAv))grpPull(e,ents);for(const e of ents)delete e._t;return{ents,bg:st.bg,pat:st.pat,night:st.night||0,party:st.party||0}}
function cleanState(st,id){st=st&&typeof st==='object'?st:{};return{ents:reid((Array.isArray(st.ents)?st.ents:[]).slice(0,230).map(cleanE).filter(e=>e&&!e.me)),bg:cleanBg(st.bg,SC[id].bg),pat:cleanPat(st.pat),night:st.night?1:0,party:st.party?1:0}}

/* ---------- finding each other ---------- */
function netTransport(code,on){const q=new URLSearchParams(location.search);
 if(q.get('net')==='bc'){ // two windows on the same computer (used for testing)
  const me=Math.random().toString(36).slice(2),ch=new BroadcastChannel('bobabay-'+code);
  ch.onmessage=ev=>{const d=ev.data;if(d.to&&d.to!==me)return;if(d.k==='hi'){on.join(d.from);if(!d.re)ch.postMessage({k:'hi',from:me,to:d.from,re:1})}else if(d.k==='bye')on.leave(d.from);else if(d.k==='m')on.msg(d.m,d.from)};
  ch.postMessage({k:'hi',from:me});
  return{send:(m,to)=>ch.postMessage({k:'m',m,from:me,to}),close:()=>{try{ch.postMessage({k:'bye',from:me});ch.close()}catch(e){}}}}
 if(!window.Trystero)throw new Error('no network library');
 const cfg={appId:'boba-bay-dollhouse-v1',password:'boba-'+code,identity:'none'},relay=q.get('relay');if(relay)cfg.relayConfig={urls:relay.split(',')};
 const room=Trystero.joinRoom(cfg,'room-'+code),act=room.makeAction('m');
 room.onPeerJoin(c=>on.join(c.peerId));room.onPeerLeave(c=>on.leave(c.peerId));act.onMessage((d,c)=>on.msg(d,c.peerId));
 if(room.onError)room.onError(err=>on.err(err&&err.code));
 return{send:(m,to)=>{const p=act.send(m,to?{target:to}:undefined);if(p&&p.catch)p.catch(()=>{})},close:()=>{try{const p=room.leave();if(p&&p.catch)p.catch(()=>{})}catch(e){}}}}
function netStart(want,code){netStop(true);NET.want=want;NET.code=code;NET.peer=null;NET.msg='';NET.role=want==='host'?'host':null;
 try{NET.tr=netTransport(code,{join:netPeerJoin,leave:netPeerLeave,msg:netMsg,err:netErr})}catch(e){NET.want=null;NET.role=null;NET.msg='Playing together needs an internet connection.'}
 clearTimeout(NET.slow);NET.slow=setTimeout(()=>{if(NET.tr&&!NET.peer&&!NET.msg&&NET.want==='guest'){NET.msg='Still looking… check the code, and that your friend\'s room is open.';netUI()}},15000);netUI()}
function netErr(code){if(!NET.tr||NET.peer)return;
 NET.msg=code==='relay-failed'?'Can\'t reach the internet meeting point. Check your connection and try again.':code==='peer-connect-failed'?'Found your friend, but this network won\'t let you connect. Try a different Wi-Fi.':code==='room-full'?'That room already has two players.':NET.msg;netUI()}
function netStop(quiet){const tr0=NET.tr,had=NET.peer,guest=NET.role==='guest';
 if(had&&tr0&&S&&guest){if(NET.mir)NET.send({t:'leave'});else if(NET.feed){scClose();netFlush();NET.send({t:'promote',id:SID})}else if(!iOwn(SID)){scClose();NET.send({t:'back',id:SID,st:scSer(S)})}} // the friend who leaves hands things over politely
 NET.tr=null;clearTimeout(NET.slow);if(tr0)tr0.close();NET.want=null;
 if(had)netApart();NET.role=null;NET.peer=null;
 if(had&&guest&&!quiet)toast('You are back in your own Boba Bay.');netUI()}
function netPeerJoin(id){if(NET.want==='guest'&&!NET.peer)NET.send({t:'hello',v:NETV,house:G.house||null},id)}
function netPeerLeave(id){if(id!==NET.peer)return;
 if(NET.role==='host'){netApart();toast('Your friend left the room.');netUI()}
 else{netStop(true);toast('The room closed. You are back in your own Boba Bay.',4200)}}

/* ---------- starting and ending a visit ---------- */
function netAccept(id,m){if(m.v!==NETV){NET.send({t:'ver'},id);return}if(NET.peer&&NET.peer!==id){NET.send({t:'busy'},id);return}
 if(NET.peer===id)netApart(); // the same friend coming back: start clean
 NET.peer=id;NET.msg='';NET.frHouse=cleanHouse(m.house);NET.there=null;NET.here=S?SID:null;NET.mir=false;NET.feed=false;NET.sent.clear();
 NET.send({t:'welcome',v:NETV,house:G.house||null});netAt();toast('Your friend joined! Look for them on the map.',4200);usfx('star');star('duo');updHud();mapPing();netUI()}
function netWelcome(id,m){avEnsure();if(S)go('map',true); // step out of my own town…
 const f=avFind();NET.peer=id;NET.role='guest';if(f)f.e.me=2;G.meNo=2; // …and into my friend's, as player 2
 NET.frHouse=cleanHouse(m.house);NET.here=null;NET.there=null;NET.mir=false;NET.feed=false;NET.sent.clear();
 closeModal();const t=$('#title');if(t){t.className='ui';t.innerHTML=''}
 netAt();toast('You joined your friend\'s town! Your own house is here too.',4600);usfx('star');star('duo');showMap();updHud();netUI();saveG()}
function netApart(){ // we are no longer connected: sort out where I am, and who and what stays in my game
 const guest=NET.role==='guest';if(NET.pend)clearTimeout(NET.pend.t);NET.pend=null;NET.queue=null;NET.drag=null;closeTrays();closeStyle();
 if(S){
  if(NET.mir){netMirSave(true);
   if(!guest&&iOwn(SID)){netPromote();const fr=S.ents.find(x=>isAv(x)&&x.me!==myNo());if(fr)rm(fr)} // my own place: I simply carry on running it
   else{netAvHome();clearScene();S=null;SID=null}}
  else{const fr=S.ents.find(x=>isAv(x)&&x.me!==myNo());if(fr)rm(fr);if(NET.rp){const e=NET.rp.e;NET.rp=null;if(byId(e.id)){tr(e).drag=0;const el=EL.get(e.id);el&&el.classList.remove('drag');place(e)}}
   if(guest||!iOwn(SID)){scClose();clearScene();S=null;SID=null}}} // a borrowed place goes back with its owner
 NET.mir=false;NET.feed=false;NET.lent=null;NET.mirror=null;NET.wg=null;NET.myAv=null;NET.avJ='';delete G.avb;NET.there=null;NET.frHouse=null;NET.frStars=0;NET.frFlags={};NET.peer=null;NET.sent.clear();NET.last.clear();
 const c=$('#rcur');if(c)c.style.display='none';dragUI(false);
 if(guest){NET.role=null;avTidy(2);G.cur='map';toMap()}else{avTidy(1);NET.here=S?SID:null;if(!S)toMap()}
 updHud();saveG()}

/* ---------- walking around ---------- */
function netAt(){NET.send({t:'at',id:NET.here,stars:stars(),flags:{tree:G.flags.tree?1:0}})}
function myAvSnap(){ // a copy of my avatar (and what it wears and holds), to send ahead to where I am going
 if(NET.mir)return NET.myAv?clone(NET.myAv):null;const f=avFind();if(!f||f.at==='pack')return null;
 const g=clone(f.at==='trav'?f.ents:grpOf(f.e,f.ents));for(const k of g)delete k._t;g[0].par=null;g[0].slot=null;return g}
function netAvHome(){if(NET.myAv&&NET.myAv.length&&T[NET.myAv[0].t]){const a=reid(clone(NET.myAv));a.forEach((k,i)=>{delete k._t;if(i)delete k.me;else k.me=myNo()});a[0].par=null;a[0].slot=null;delete a[0].dx;delete a[0].dy;a[0].s.pose='stand';delete a[0].s.lie;G.trav=a}
 NET.myAv=null;NET.avJ='';delete G.avb} // my avatar steps out of my friend's copy and back to me
function netLeave(){ // I walk out of the place I am in (the room code stays)
 if(!S)return;
 if(NET.mir){netMirSave(true);NET.send({t:'leave'});netAvHome();NET.mir=false;NET.mirror=null;NET.wg=null;NET.drag=null}
 else{scClose();
  if(NET.feed){netFlush();NET.send({t:'promote',id:SID});NET.feed=false;const fr=S.ents.find(x=>isAv(x)&&x.me!==myNo());if(fr)grpPull(fr,S.ents)} // my friend stays: they run it from now on
  else if(!iOwn(SID))NET.send({t:'back',id:SID,st:scSer(S)}); // a borrowed place goes back to its owner
  NET.lent=null}
 clearScene();S=null;SID=null}
function netGo(id,quiet){if(NET.pend)return; // already on my way somewhere
 const sc=id!=='map'&&SC.hasOwnProperty(id)?SC[id]:null;if(sc&&S&&id===SID)return;closeTrays();closeStyle();setMode('play');
 if(!sc){netLeave();NET.here=null;toMap();netAt();return}
 if(NET.there!==id&&iOwn(id)){netLeave();NET.here=id;scOpen(id,myScene(id),{quiet});netAt();return} // my own place and my friend is not in it: just walk in
 const n=++NET.seq,av=myAvSnap();NET.pend={id,quiet,n,av,t:setTimeout(()=>{if(NET.pend&&NET.pend.n===n){NET.pend=null;toast('Couldn\'t get there — try again.')}},6000)};
 NET.send({t:'enter',id,n,av})} // ask my friend: are you in there? may I have the place?
function netReply(m){const P=NET.pend;
 if(!P||m.n!==P.n){if(m.t==='join')NET.send({t:'leave'});netAt();return} // an answer that came too late: I am not coming after all
 clearTimeout(P.t);NET.pend=null;if(m.t==='no'||(m.t==='own'&&!iOwn(P.id))){usfx('nope');return}
 netLeave();NET.here=P.id;

 rocket:`<g transform="rotate(40 100 100)">`+P('M72 150 Q66 70 100 30 Q134 70 128 150Z','#e9eefb')+P('M84 54 Q100 30 116 54Z','#ff5c7a')+C(100,88,14,'#7ad3ff')+P('M72 150 L52 170 L74 130Z','#ff5c7a')+P('M128 150 L148 170 L126 130Z','#ff5c7a')+P('M86 150 L100 184 L114 150Z','#ffb74d')+`</g>`,
 stars:L('M50 60 L90 90 L130 60 L150 110 L100 140','#7ad3ff',3)+[[50,60],[90,90],[130,60],[150,110],[100,140]].map(([x,y])=>P(star5(x,y,12,5),'#fff3a8')).join(''),
 ufo:P('M70 96 Q70 56 100 56 Q130 56 130 96Z','#c9f0ff')+E(100,104,70,24,'#8d99ae')+E(100,97,70,20,'#b7c0d3')+C(60,104,6,'#ffd23f')+C(100,112,6,'#ff5c7a')+C(140,104,6,'#56d39a')+C(90,80,5,INK)+C(110,80,5,INK)+P('M76 126 L124 126 L150 186 L50 186Z','#b8e986',0,' opacity=".5"')};
function showSight(txt,k){showModal(`<div class="scope"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="98" fill="#1d1f4d"/>${[[30,60],[160,40],[176,140],[36,150],[100,24]].map(([x,y])=>C(x,y,2.500,'#fff')).join('')}${SIGHTART[k]||''}</svg></div><h2>You spotted ${txt}</h2>`,'sight');clearTimeout(sightT);sightT=setTimeout(()=>{if($('#modal').classList.contains('sight'))closeModal()},2800)}
function showHint(){const c=STK.filter(s=>!G.st[s[0]]);showModal(c.length?`<h2>The note says…</h2><p class="note">“${pick(c)[2]}”</p><p class="sub sm">Tap the bottle again for another clue.</p>`:`<h2>The note says…</h2><p class="note">“You found every single secret. You are a Boba Bay legend!”</p>`,'hint')}

/* ---------- map & title ---------- */
const BALLOON=`<svg viewBox="0 0 120 190"><path d="M60 4 Q112 4 112 60 Q112 100 74 128 L46 128 Q8 100 8 60 Q8 4 60 4Z" fill="#ff7aa8"/><path d="M60 4 Q84 30 74 128 L46 128 Q36 30 60 4Z" fill="#ffd23f"/><path d="M48 128 L50 150 M72 128 L70 150" stroke="#8a5a44" stroke-width="3"/><rect x="42" y="148" width="36" height="26" rx="6" fill="#c9a27a"/><g class="gf"><rect x="46" y="132" width="28" height="22" rx="4" fill="#7ad3ff"/><rect x="57" y="132" width="6" height="22" fill="#fff"/><path d="M60 132 Q50 120 48 128 Q50 134 60 132 Q70 134 72 128 Q70 120 60 132Z" fill="#fff"/></g></svg>`;
function showMap(){const m=$('#map');m.className='ui on';$stage.classList.add('onmap');let html=mapSVG();
 for(const s of mapSpots()){const open=spotOpen(s);if(s.secret&&!open)continue;html+=`<div class="mlabel${open?'':' lk'}${s.art==='home'&&NET.peer?' mine':''}" style="left:${s.x}px;top:${s.y+12}px">${open?'':IC.lock}<span>${s.n}</span>${!open&&s.need?`<b>${s.need}</b>${IC.star}`:!open&&s.duo?IC.duo:''}</div>`;
  if(s.art==='home')html+=`<button class="hbrush" id="hpaint" style="left:${s.x+72}px;top:${s.y-4}px" aria-label="Paint my house">${IC.brush}</button>`}
 const ready=G.daily.last!==dayN();html+=`<button class="gbal${ready?' ready':''}" id="gbal">${outline(BALLOON,5)}<span>${ready?'Gift!':'Tomorrow'}</span></button><div class="mtitle">Boba Bay</div><div class="mfr" id="mfr" style="display:none">${IC.duo}<span>Friend is here!</span></div>`;
 m.innerHTML=html;showMap.sig=mapSig();netMark();updHud();
 m.onclick=ev=>{if(ev.target.closest('#hpaint')){openHouse();return}const sp=ev.target.closest('[data-go]');if(sp){const s=mapSpots().find(x=>x.id===sp.dataset.go);if(!s)return;if(!spotOpen(s)){usfx('nope');toast(s.duo?'Buddy Island opens when two friends play together! Tap the two-friends button to start.':s.need?`${s.n} opens when you have ${s.need} stars. You have ${stars()} so far!`:'Just a very tall tree… I wonder what\'s up there? Maybe the park has a clue.');return}usfx('pop');go(s.id);return}
  if(ev.target.closest('[data-whale]')){usfx('splash');const w=m.querySelector('.whale');w.classList.remove('hi');void w.getBoundingClientRect();w.classList.add('hi');if(!G.st.whale){star('whale');setTimeout(()=>!SID&&showMap(),900)}return}
  if(ev.target.closest('#gbal'))openGift()}}
const HWALL=['#ffe3ea','#fff3c4','#ffe2c8','#dcf6c9','#d3f3ee','#e3f0ff','#f0deff','#ffffff'],HROOF=['#ff7d9a','#ff8552','#ffc531','#56c596','#2bb7a3','#5b9bf0','#9b6bff','#8a5a44'];
function openHouse(){const hs=Object.assign({},HOUSE0,G.house),row=(k,list)=>list.map(c=>`<button class="swt${hs[k]===c?' on':''}" data-k="${k}" data-c="${c}" style="background:${c}"></button>`).join('');
 const ren=()=>{$('#hfig').innerHTML=`<svg viewBox="-70 -246 366 276">${outline(houseCol(mapSVG.home,hs),5)}</svg>`;$('#hctl').innerHTML=`<div class="lbl">Walls</div><div class="sws">${row('w',HWALL)}</div><div class="lbl">Roof</div><div class="sws">${row('r',HROOF)}</div>`};
 showModal(`<h2>Paint my house</h2><div class="mepick"><div class="mefig hfig" id="hfig"></div><div class="mectl" id="hctl"></div></div><button class="btn" id="hok">Done</button>`,'mewin');ren();
 $('#hctl').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;hs[b.dataset.k]=b.dataset.c;G.house={w:hs.w,r:hs.r};usfx('splat');star('housepaint');dirty();ren();if(NET.peer)NET.send({t:'house',h:G.house});if(!SID)showMap()};
 $('#hok').onclick=closeModal}
/* the map is only redrawn when something on it really changed — otherwise a tap could get lost while a friend's news arrives */
function mapSig(){return JSON.stringify([G.house,NET.frHouse,!!NET.peer,NET.role,mapSpots().map(s=>s.id+(spotOpen(s)?1:0)),!!G.st.whale,G.daily.last===dayN()])}
function netMark(){const el=$('#mfr');if(!el)return;const s=NET.peer&&NET.there?mapSpots().find(x=>x.id===netSpot(NET.there)):null;if(!s){el.style.display='none';return}el.style.display='';el.style.left=s.x+'px';el.style.top=(s.y+50)+'px'}
function mapPing(){if(SID||!$('#map').classList.contains('on'))return;if(showMap.sig!==mapSig())showMap();else netMark()}
function hideMap(){const m=$('#map');m.className='ui';m.innerHTML='';m.onclick=null;$stage.classList.remove('onmap')}
function showTitle(){const t=$('#title'),cols=['#ff5c7a','#ff8552','#ffd23f','#56d39a','','#7ad3ff','#6c63ff','#d58bff'];t.className='ui on';
 const me=G.flags.av?avFind():null,fig=(e,cls)=>`<div class="tf ${cls||''}">${thumb(e)}${/me/.test(cls||'')&&me?'<span class="avtag me">ME</span>':''}</div>`;
 t.innerHTML=`<svg class="tsky" viewBox="0 0 1600 900">${cloud(120,170,1.600)}${cloud(1180,120,1.300)}${cloud(700,60,.9)}</svg><div class="logo">`+'Boba Bay'.split('').map((c,i)=>c===' '?'<i class="sp"></i>':`<i style="animation-delay:${(i*.09).toFixed(2)}s;color:${cols[i]}">${c}</i>`).join('')+`</div><p class="tag">a cozy little world to explore, decorate &amp; discover</p><div class="tchars">`+fig(mk('pet',0,0,petO('bunny'),true),'p')+fig(mk('char',0,0,CH.bro,true))+fig(me?me.e:mk('char',0,0,CH.me,true),'big me')+fig(mk('char',0,0,CH.kid,true))+fig(mk('pet',0,0,petO('cat'),true),'p')+fig(mk('pet',0,0,petO('axo'),true),'p')+`</div><button class="btn play" id="play">Play!</button>`;
 $('#play').onclick=()=>{ac();musicOn();sfx.star();t.classList.add('out');setTimeout(()=>{t.className='ui';t.innerHTML=''},450);go('map');avEnsure();
  const tut=()=>{if(!G.flags.tut){G.flags.tut=1;dirty();setTimeout(openHelp,300)}};if(!G.flags.av)setTimeout(()=>openMe(!G.flags.tut,tut),500);else tut()}}

/* ---------- start-up ---------- */
function fit(){const w=innerWidth,hh=innerHeight;SCALE=Math.min(w/W,hh/H);$stage.style.transform=`translate(${((w-W*SCALE)/2).toFixed(1)}px,${((hh-H*SCALE)/2).toFixed(1)}px) scale(${SCALE.toFixed(4)})`}
function boot(){G=loadG();G.pack=G.pack.filter(a=>a&&a.length&&a.every(e=>T[e.t]));avTidy(G.meNo||1); // only my own avatar lives in my saved game
 $stage=$('#stage');$bg=$('#bg');$ents=$('#ents');$fx=$('#fx');$lights=$('#lights');$pack=$('#pack');$trash=$('#trash');
 $('#b-map').innerHTML=IC.map;$('#b-set').innerHTML=IC.gear;$('#b-paint').innerHTML=IC.brush;$('#b-cat').innerHTML=IC.sofa;$('#b-stars').innerHTML=IC.star+'<b>0</b>';$pack.innerHTML=outline(IC.bag,3.4)+'<span class="badge"></span>';$trash.innerHTML=IC.trash;
 $('#b-net').innerHTML=IC.duo;$('#b-net').onclick=()=>openNet();netWrap();
 $('#b-map').onclick=()=>{usfx('pop');go('map')};$('#b-set').onclick=openSettings;$('#b-stars').onclick=()=>openBook();$('#b-paint').onclick=()=>openTray('paint');$('#b-cat').onclick=()=>openTray('cat');$pack.onclick=()=>openTray('pack');xInit();
 $('#nav-l').onclick=()=>{const n=SC[SID].nav;if(n&&n.l)go(n.l)};$('#nav-r').onclick=()=>{const n=SC[SID].nav;if(n&&n.r)go(n.r)};
 $stage.addEventListener('pointerdown',onDown);window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
 window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
 document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
 document.addEventListener('visibilitychange',()=>{if(document.hidden)saveG()});window.addEventListener('pagehide',saveG);
 setInterval(tick,250);updHud();showTitle()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

</script>
