<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2350">
<title>Boba Bay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff7aa8'/%3E%3Ccircle cx='22' cy='28' r='5' fill='%232a1f3d'/%3E%3Ccircle cx='42' cy='28' r='5' fill='%232a1f3d'/%3E%3Cpath d='M22 40 Q32 50 42 40' fill='none' stroke='%232a1f3d' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;color:#2a1f3d;
 font-family:'Fredoka','Baloo 2',ui-rounded,'SF Pro Rounded','Nunito','Varela Round','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif}
body{background:radial-gradient(circle at 50% 30%,#6b56c9,#2b2350)}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;background:none;outline:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;border-radius:30px;background:#bfe9ff;box-shadow:0 20px 60px rgba(0,0,0,.4);touch-action:none}
#bg,#ents,#night,#party,#lights,#fx,#hud,#map,#toasts,#modal,#title{position:absolute;left:0;top:0;width:100%;height:100%}
#bg svg{display:block}
#ents{z-index:1}
#night{z-index:2;pointer-events:none;background:#1b1850;opacity:0;mix-blend-mode:multiply;transition:opacity .4s}
.night #night{opacity:.6}
#party{z-index:3;pointer-events:none;opacity:0;background:radial-gradient(circle at 20% 30%,rgba(255,92,122,.55),transparent 40%),radial-gradient(circle at 80% 30%,rgba(122,211,255,.55),transparent 40%),radial-gradient(circle at 50% 85%,rgba(255,210,63,.55),transparent 45%)}
.party #party{opacity:1;animation:party 1.4s linear infinite}
@keyframes party{50%{filter:hue-rotate(180deg)}100%{filter:hue-rotate(360deg)}}
#lights{z-index:4;pointer-events:none}
#lights .glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,238,170,.72),rgba(255,238,170,.28) 40%,rgba(255,238,170,0) 70%)}
#map{z-index:40;display:none}
#hud{z-index:50;pointer-events:none}
#modal{z-index:80;display:none}
#fx{z-index:85;pointer-events:none}
#toasts{z-index:88;pointer-events:none}
#title{z-index:90;display:none}
#stage.enter #ents,#stage.enter #bg{animation:fadein .32s}
@keyframes fadein{from{opacity:0;transform:scale(1.03)}}

/* ---------- things ---------- */
.ent{position:absolute;left:0;top:0;pointer-events:none}
.ent>.in{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 100%;transition:transform .12s}
.ent .g,.ent .f,.ent .kids{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ent .g{z-index:0}.ent .k1{z-index:1}.ent .f{z-index:2}.ent .k2{z-index:3}
.ent svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;display:block}
.ent svg *{pointer-events:visiblePainted;cursor:grab}
.ent svg .np,.ent svg .np *{pointer-events:none}
.ent svg .hit{pointer-events:all}
.ent.k-fix svg *{cursor:pointer}
.painting .ent svg *,.painting #bg{cursor:crosshair}
.ent.flip>.in>.g>svg,.ent.flip>.in>.f>svg{transform:scaleX(-1)}
.ent.drag>.in{transform:scale(1.07) rotate(-3deg);filter:drop-shadow(0 16px 10px rgba(30,10,60,.28))}
.ent.sm>.in{transform:scale(.68)}
.ent.hd>.in{transform:scale(1.1)}
.ent.big>.in{transform:scale(1.45)}
.ent.tiny>.in{transform:scale(.55)}
.ent.gone>.in{transform:scale(0);transition:transform .2s}
.ent.rbw>.in>.g [data-p="b"]{animation:rbw 1.6s linear infinite}
@keyframes rbw{0%,100%{fill:#ff5c7a}17%{fill:#ff8552}33%{fill:#ffd23f}50%{fill:#56d39a}67%{fill:#7ad3ff}83%{fill:#9b6bff}}
.ent.zz::after{content:'z z Z';position:absolute;left:62%;top:-36px;font-weight:700;font-size:30px;color:#6c63ff;text-shadow:0 2px 0 #fff;animation:zzz 2.4s ease-in-out infinite;white-space:nowrap;pointer-events:none}
.ent.lie.zz::after{left:70%;top:6px}
@keyframes zzz{0%{opacity:0;transform:translate(0,10px) scale(.7)}40%{opacity:1}100%{opacity:0;transform:translate(26px,-44px) scale(1.1)}}
.ent.bob>.in,.ent.bobf>.in{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}
.ent.swinging>.in>.k1,.ent.swinging>.in>.f{animation:swing 1.9s ease-in-out infinite;transform-origin:50% 4%}
@keyframes swing{0%,100%{transform:rotate(11deg)}50%{transform:rotate(-11deg)}}
.party .k-char>.in,.party .k-pet>.in{animation:dance .5s ease-in-out infinite}
.k-char>.in>.g,.k-pet>.in>.g{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scale(1.012,.988)}}
.in.a-pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
.in.a-land{animation:land .24s}
.in.a-wig{animation:wig .32s}
.in.a-hop{animation:hop .42s}
.in.a-chomp{animation:chomp .22s}
.in.a-shake{animation:shake .5s}
.in.a-bounce{animation:bounce .65s}
.in.a-dance{animation:dance .4s 3}
.in.a-buzz{animation:buzz .1s 13}
.in.a-spin{animation:spinY .6s}
.in.a-launch{animation:launch 1.6s ease-in-out}
@keyframes pop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes land{0%{transform:scale(1.14,.84)}55%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-40px) scale(.96,1.05)}70%{transform:translateY(0) scale(1.08,.92)}}
@keyframes chomp{50%{transform:scale(1.06,.93)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%{transform:translateY(0) scale(1.1,.86)}25%{transform:translateY(-70px)}50%{transform:translateY(0) scale(1.08,.9)}70%{transform:translateY(-26px)}100%{transform:translateY(0)}}
@keyframes dance{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-14px)}}
@keyframes buzz{0%,100%{transform:translateX(-3px) rotate(-1deg)}50%{transform:translateX(3px) rotate(1deg)}}
@keyframes spinY{to{transform:rotateY(360deg)}}
@keyframes launch{0%{transform:translateY(0)}45%{transform:translateY(-640px)}55%{transform:translateY(-640px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
/* little animations that live inside the drawings */
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.chew{animation:chew .3s infinite;transform-box:fill-box;transform-origin:center}
@keyframes chew{50%{transform:scaleY(.35)}}
.wag{animation:wag .9s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
.steam{animation:steam 1.6s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.spin{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sunspin{animation:spin 18s linear infinite}
.ccspin{animation:spin 3s linear infinite}
.ent .glow{animation:ovglow .8s ease-in-out infinite alternate}
@keyframes ovglow{from{opacity:.55}to{opacity:1}}
.tvb{animation:tvb 1.2s ease-in-out infinite}
@keyframes tvb{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,-40px)}}
.tvf{animation:tvf 4s linear infinite}
@keyframes tvf{0%{transform:translateX(-130px)}100%{transform:translateX(230px)}}
.tvr{animation:tvr 1.4s ease-in-out infinite}
@keyframes tvr{50%{transform:translateY(-12px)}}
.fishA{animation:fa 5s ease-in-out infinite}
@keyframes fa{50%{transform:translateX(84px)}}
.fishB{animation:fb 6s ease-in-out infinite}
@keyframes fb{50%{transform:translateX(-92px)}}
.bub{animation:bub 2.4s ease-in infinite}
@keyframes bub{0%{transform:translateY(14px);opacity:0}30%{opacity:.8}100%{transform:translateY(-34px);opacity:0}}
.lavab{animation:lava 4s ease-in-out infinite}
@keyframes lava{50%{transform:translateY(-22px)}}
.flame{animation:flame .45s ease-in-out infinite alternate;transform-origin:50% 100%;transform-box:fill-box}
@keyframes flame{to{transform:scale(1.07,.9)}}
.drip{animation:drip .3s linear infinite}
@keyframes drip{50%{opacity:.55}}
.discospin{animation:disco 1.6s linear infinite}
@keyframes disco{50%{filter:hue-rotate(180deg) brightness(1.15)}}
.snowing{animation:snow .9s linear infinite}
@keyframes snow{0%{transform:translateY(-12px)}100%{transform:translateY(14px)}}
.tw{animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}

/* ---------- effects ---------- */
.fx{position:absolute;pointer-events:none}
.fx i{display:block}
.fx.pt{animation:fly .8s ease-out both;margin:-10px 0 0 -10px}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
.fx.rise{animation:rise 1.2s ease-out both;margin-left:-15px}
@keyframes rise{0%{transform:translateY(10px) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-96px) scale(1.1);opacity:0}}
.fx.bubl i{border-radius:50%;border:3px solid #fff;background:rgba(190,240,255,.5)}
.fx.say{transform:translate(-50%,-100%);background:#fff;border:3.5px solid #35252d;border-radius:24px;padding:8px 20px;font-size:28px;font-weight:600;box-shadow:0 4px 0 rgba(53,37,45,.2);animation:sayin .25s cubic-bezier(.3,1.6,.5,1);width:max-content;max-width:540px;text-align:center;line-height:1.15}
.fx.say::after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-9px;width:16px;height:16px;background:#fff;border-right:3.5px solid #35252d;border-bottom:3.5px solid #35252d;transform:rotate(45deg);border-radius:0 0 5px 0}
@keyframes sayin{from{transform:translate(-50%,-80%) scale(.4);opacity:0}}

/* ---------- buttons on screen ---------- */
.rb{position:absolute;width:88px;height:88px;border-radius:50%;background:#fff;border:3.5px solid #35252d;box-shadow:0 5px 0 rgba(53,37,45,.28);pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.rb:active{transform:scale(.92)}
.rb svg{width:54px;height:54px}
.rb.act{background:#ffd23f}
#b-map{left:22px;top:22px}
#topbar{position:absolute;left:126px;top:34px;display:flex;gap:10px;align-items:center}
#sname{height:64px;line-height:57px;padding:0 28px;border-radius:32px;background:#fff;border:3.5px solid #35252d;font-size:30px;font-weight:600;box-shadow:0 5px 0 rgba(53,37,45,.28);white-space:nowrap}
#b-set{right:22px;top:22px}
#b-stars{position:absolute;right:126px;top:30px;height:72px;padding:0 28px 0 14px;border-radius:36px;background:#fff;border:3.5px solid #35252d;box-shadow:0 5px 0 rgba(53,37,45,.28);display:flex;align-items:center;gap:8px;font-size:36px;font-weight:700;pointer-events:auto}
#b-stars svg{width:50px;height:50px}
#b-stars:active{transform:scale(.94)}
#b-paint{left:22px;top:132px}
#b-cat{left:22px;top:236px}
.nav{height:60px;padding:0 20px 0 12px;border-radius:30px;background:#6c63ff;border:3.5px solid #35252d;color:#fff;font-size:23px;font-weight:600;display:flex;align-items:center;gap:4px;pointer-events:auto;box-shadow:0 5px 0 rgba(53,37,45,.28);white-space:nowrap}
#nav-r{padding:0 12px 0 20px}
.nav svg{width:32px;height:32px}
.nav:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(30,10,60,.2)}
#pack{position:absolute;right:20px;bottom:18px;width:130px;height:130px;pointer-events:auto;cursor:pointer;transition:transform .15s;z-index:3}
#pack svg{width:100%;height:100%;filter:drop-shadow(0 6px 0 rgba(30,10,60,.18));overflow:visible}
#pack .lid{transition:transform .15s;transform-origin:50% 100%;transform-box:fill-box}
#pack.open{transform:scale(1.22)}
#pack.open .lid{transform:rotate(-26deg) translateY(-6px)}
#pack.act svg{filter:drop-shadow(0 0 0 #ffd23f) drop-shadow(0 6px 0 rgba(30,10,60,.18))}
#pack.bump{animation:land .3s}
#pack .badge{position:absolute;right:-2px;top:2px;min-width:44px;height:44px;border-radius:22px;background:#6c63ff;color:#fff;font-size:24px;font-weight:700;line-height:44px;text-align:center;padding:0 8px;box-shadow:0 3px 0 rgba(30,10,60,.2)}
#trash{position:absolute;left:22px;bottom:22px;width:108px;height:108px;border-radius:50%;background:#fff;border:3.5px solid #35252d;box-shadow:0 5px 0 rgba(53,37,45,.28);display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .15s,background .15s;z-index:3}
#trash svg{width:64px;height:64px}
.dragging #trash{transform:scale(1)}
.dragging #trash.open{transform:scale(1.25);background:#ffb3c7}
.onmap #b-map,.onmap #topbar,.onmap #b-paint,.onmap #b-cat,.onmap .nav,.onmap #pack,.onmap #trash,.onmap #tray,.onmap #stylep{display:none!important}

/* ---------- trays (backpack / catalog / paint) ---------- */
#tray{position:absolute;left:150px;right:170px;bottom:16px;background:#fff;border:3.5px solid #35252d;border-radius:30px;box-shadow:0 7px 0 rgba(53,37,45,.28);padding:12px 18px 12px;display:none;pointer-events:auto;transition:opacity .15s,transform .15s}
#tray.on{display:block}
.dragging #tray{opacity:0;pointer-events:none;transform:translateY(40px)}
#tray .tt{font-size:24px;font-weight:600;margin:0 6px 8px}
#tray .tt small{font-weight:500;color:#8d99ae;margin-left:10px;font-size:20px}
#tray .row{display:flex;gap:10px;align-items:center}
#tray .scroll{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;padding-bottom:6px;scrollbar-width:thin}
.slot{flex:0 0 auto;width:114px;height:126px;border-radius:20px;background:#f3eefb;border:3px solid #35252d;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;pointer-events:auto}
.slot .th{width:94px;height:86px;pointer-events:none}
.slot em{font-style:normal;font-size:15px;font-weight:600;color:#6b6475;max-width:106px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.slot:active{background:#e3d9f7}
.slot.lock .th{filter:grayscale(1) opacity(.4)}
.slot .lk{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:1px;background:#fff;border-radius:14px;padding:2px 9px 2px 3px;font-size:18px;font-weight:700;pointer-events:none}
.slot .lk svg{width:24px;height:24px}
.slot.big{width:200px;height:210px;background:#fff7d6;cursor:default}
.slot.big .th{width:160px;height:150px}
.slot.big em{font-size:22px;max-width:190px;color:#2a1f3d}
.empty{font-size:22px;color:#8d99ae;padding:34px 20px}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tab{height:44px;padding:0 20px;border-radius:22px;background:#efe9fb;border:3px solid #35252d;font-size:21px;font-weight:600;color:#6b6475}
.tab.on{background:#6c63ff;color:#fff}
.swt{flex:0 0 auto;width:43px;height:43px;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(30,10,60,.13);position:relative;transition:transform .1s}
.swt.on{box-shadow:0 0 0 3px #fff,0 0 0 7px #2a1f3d;transform:scale(1.06)}
.swt.rnd{background:conic-gradient(#ff5c7a,#ffd23f,#56d39a,#7ad3ff,#9b6bff,#ff5c7a)}
.swt.rnd svg{width:27px;height:27px;position:absolute;left:8px;top:8px}
#tray .sw{gap:8px;padding:4px 6px}
#tray .pats{margin-top:12px;gap:8px;padding:0 6px 4px}
#tray .pats span{font-size:20px;font-weight:600;margin:0 4px 0 6px}
.patb{width:50px;height:50px;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 3px rgba(30,10,60,.13);flex:0 0 auto;position:relative}
.patb svg{width:100%;height:100%;display:block}
.patb.on{box-shadow:0 0 0 3px #fff,0 0 0 7px #2a1f3d}
#stylep{position:absolute;left:124px;top:124px;width:338px;background:#fff;border:3.5px solid #35252d;border-radius:30px;padding:16px 18px;box-shadow:0 7px 0 rgba(53,37,45,.28);display:none;pointer-events:auto}
#stylep.on{display:block}
#stylep h3{margin:0 0 8px;font-size:30px;text-align:center;color:#ff5c7a}
.srow{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.srow button{width:56px;height:56px;border-radius:50%;background:#6c63ff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(30,10,60,.2)}
.srow button:active{transform:translateY(3px);box-shadow:none}
.srow button svg{width:32px;height:32px}
.srow span{font-size:25px;font-weight:600}
.lbl{font-size:19px;font-weight:600;color:#8d99ae;margin:10px 0 6px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sws .swt{width:40px;height:40px}
.srow2{display:flex;gap:8px;margin-top:14px;align-items:center}

/* ---------- pop-ups ---------- */
.btn{display:inline-block;height:68px;padding:0 34px;border-radius:34px;background:#6c63ff;border:3.5px solid #35252d;color:#fff;font-size:28px;font-weight:700;box-shadow:0 5px 0 rgba(53,37,45,.3);pointer-events:auto}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,10,60,.22)}
.btn.warn{background:#ff8fb1}
.btn.tog{background:#2bb7a3}
.btn.sm{height:50px;padding:0 13px;font-size:19px;background:#efe9fb;color:#6b6475;box-shadow:none;border-width:3px}
.btn.sm.on{background:#ffd23f;color:#2a1f3d}
.btn.sm.dice svg{width:30px;height:30px;vertical-align:middle}
#modal{background:rgba(42,31,61,.5);align-items:center;justify-content:center}
#modal.on{display:flex}
#modal .card{position:relative;background:#fff;border:4px solid #35252d;border-radius:40px;padding:34px 46px;max-width:1260px;min-width:540px;max-height:810px;box-shadow:0 10px 0 rgba(53,37,45,.35);text-align:center;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#modal h2{margin:0 0 14px;font-size:44px;color:#6c63ff}
.sub{font-size:26px;margin:14px 0;color:#6b6475}
.sub.sm{font-size:20px}
#modal .close{position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:#ff5c7a;border:3.5px solid #35252d;box-shadow:0 4px 0 rgba(53,37,45,.3);display:flex;align-items:center;justify-content:center}
.close svg{width:36px;height:36px}
.tips{text-align:left;font-size:27px;line-height:1.55;margin:0 0 22px;padding-left:30px;max-width:920px}
.tips b{color:#ff5c7a}
.opts{display:flex;flex-direction:column;gap:14px;min-width:470px}
.giftbox{width:260px;height:260px;margin:10px auto;cursor:pointer;animation:gbob 1.2s ease-in-out infinite}
.giftbox svg{width:100%;height:100%}
.giftbox.shk{animation:shake .4s}
@keyframes gbob{50%{transform:translateY(-12px) rotate(-3deg)}}
.rew{display:flex;gap:18px;justify-content:center}
.streak{display:flex;gap:10px;justify-content:center;margin:10px 0}
.streak i{width:50px;height:50px;border-radius:50%;background:#efe9fb;font-style:normal;font-size:24px;font-weight:700;line-height:50px;color:#b7b0c6}
.streak i.on{background:#ffd23f;color:#2a1f3d}
.streak i svg{width:34px;height:34px;margin-top:8px}
.note{font-size:34px;font-weight:600;color:#8a5a44;background:#fff6e0;border-radius:22px;padding:26px 34px;max-width:780px;margin:10px auto}
.scope{width:340px;height:340px;margin:0 auto 12px;border-radius:50%;border:14px solid #ffd23f;overflow:hidden}
.scope svg{width:100%;height:100%;display:block}
#modal.book .card{width:1260px;height:800px;padding:26px 30px;display:flex;flex-direction:column;text-align:left}
.mh{display:flex;align-items:center;gap:34px;margin-bottom:12px;padding-right:40px}
.mh .big{display:flex;align-items:center;gap:8px;font-size:46px;font-weight:700}
.mh .big svg{width:62px;height:62px}
.mh .big span{font-size:26px;font-weight:600;color:#8d99ae}
.nx{flex:1}

 if(o){if(o.c)Object.assign(e.c,o.c);if(o.s)Object.assign(e.s,o.s);for(const k in o)if(k!=='c'&&k!=='s')e[k]=o[k]}

 if(p&&EL.get(p.id)){kbox(p,e.slot).appendChild(el);el.classList.toggle('sm',isSm(p,e.slot));el.classList.toggle('hd',isHd(p,e.slot));el.classList.toggle('bob',!!TD(p).water&&e.slot==='surf')}else $ents.appendChild(el);

function mountAll(){let pend=S.ents.slice(),guard=0;while(pend.length&&guard++<12){const next=[];for(const e of pend){if(!e.par||EL.has(e.par))mountE(e);else next.push(e)}pend=next}

const SLZ={stand:1,in:1,sleep:1,surf:2,cup:2,seat:3,handL:3,handR:3,head:4,mouth:6};
function zOf(e){const d=TD(e);return d.mt==='rug'?3:d.mt==='wall'?20+(e.zz||0):d.z!=null?d.z:100+Math.round(e.y)}
function posE(e){const el=EL.get(e.id);if(!el)return;const d=TD(e);let x,y,z;const p=e.par&&byId(e.par);

 else{x=e.x-d.w/2;y=e.y-d.h;z=tr(e).drag?9000:zOf(e)}
 el.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;el.style.zIndex=z}

function popOut(t,x,y,o,vx){const e=spawn(t,clamp(x,40,W-40),y,o),sid=SID;anim(e,'pop',300);
 setTimeout(()=>{if(SID!==sid||!byId(e.id)||e.par||tr(e).drag)return;e.x=clamp(e.x+(vx||0),50,W-50);place(e)},170);return e}
function rm(e){for(const k of kidsOf(e))rm(k);const p=e.par&&byId(e.par),el=EL.get(e.id);if(el)el.remove();EL.delete(e.id);TRN.delete(e.id);IDX.delete(e.id);

function landFx(e,an){if(!byId(e.id))return;const d=TD(e);if(an==='fall'){anim(e,d.bouncy?'bounce':'land',d.bouncy?600:240);const p=e.par&&byId(e.par);

function unpar(e){if(!e.par)return;const a=absXY(e),p=byId(e.par),sl=e.slot,el=EL.get(e.id);e.par=null;e.slot=null;e.x=a.x;e.y=a.y;delete e.dx;delete e.dy;

function surfaces(ex){const out=[];for(const e of S.ents){const d=TD(e);if(!d.surf||ex.has(e.id)||(e.slot&&e.slot!=='surf'))continue;const a=absXY(e),f=e.flip?-1:1;
  for(const s of d.surf)out.push({x1:a.x+(f>0?s[0]:-s[1]),x2:a.x+(f>0?s[1]:-s[0]),y:a.y+s[2],o:e})}return out}
function findRest(e,x,y){const sc=SC[SID],[ft,fb]=sc.floor,sfs=surfaces(subIds(e)).filter(s=>x>=s.x1-12&&x<=s.x2+12);let best=null;
 for(const s of sfs){const dy=s.y-y;if(dy>=-46&&dy<=44&&(!best||Math.abs(dy)<Math.abs(best.y-y)))best=s}
 if(best)return best;
 if(y>=ft-6)return{y:clamp(y,ft+6,fb),o:null};
 for(const s of sfs)if(s.y>=y&&(!best||s.y<best.y))best=s;
 const fy=ft+(sc.land||56);return best&&best.y<fy+40?best:{y:fy,o:null}}
function place(e){const d=TD(e),sc=SC[SID],[ft,fb]=sc.floor,x=clamp(e.x,Math.min(d.w*.3,90),W-Math.min(d.w*.3,90)),y=e.y;
 if(d.mt==='wall'){e.zz=S.zc=(S.zc||0)+1;setFree(e,x,clamp(y,d.h+10,ft-36),'put');return}
 if(d.mt==='rug'){setFree(e,x,clamp(y,ft+d.h*.45,fb+24),'put');return}
 if(d.float){setFree(e,x,d.h+rnd(14,60),'float');return}
 if((d.k==='furn'&&!d.tt)||d.k==='fix'){setFree(e,x,y<ft?ft+(sc.land||56):Math.min(y,fb),'fall');return}
 const r=findRest(e,x,y);
 if(r.o){const a=absXY(r.o);attach(e,r.o,'surf',clamp(x,r.x1+6,r.x2-6)-a.x,r.y-a.y,'fall')}else setFree(e,x,r.y,'fall')}

/* ---------- people & pets: holding, wearing, eating, sleeping ---------- */
function chSlot(ch,slot,it){const s=ch.s.pose==='sit'?42:0,d=TD(it);
 if(slot==='head')return{dx:0,dy:-197+s+((d.hat&&d.hat.dy)||0)};
 if(slot==='handL')return{dx:-46,dy:-62+s+d.h/2};
 if(slot==='handR')return{dx:46,dy:-62+s+d.h/2};
 return{dx:0,dy:-134+s+d.h/2}}
function reslot(ch){for(const k of kidsOf(ch))if(['head','handL','handR'].includes(k.slot)){const sl=chSlot(ch,k.slot,k);k.dx=sl.dx;k.dy=sl.dy;posE(k)}}
function dropAll(w){for(const k of kidsOf(w)){unpar(k);k.x+=rnd(-90,90);place(k)}}
function hold(ch,it,slot){const other=slot==='handL'?'handR':'handL';if(kidIn(ch,slot)){if(!kidIn(ch,other))slot=other;else{const old=kidIn(ch,slot);unpar(old);old.x+=slot==='handL'?-80:80;place(old)}}
 const sl=chSlot(ch,slot,it);attach(it,ch,slot,sl.dx,sl.dy,'go');sfx.pop()}
function wear(who,hat){const old=kidIn(who,'head'),isCh=TD(who).k==='char';if(old){unpar(old);old.x+=pick([-1,1])*rnd(60,100);place(old)}
 const sl=isCh?chSlot(who,'head',hat):{dx:0,dy:-72};attach(hat,who,'head',sl.dx,sl.dy,'go');sfx.pop();star(isCh?'hat':'pethat')}
function sleepOn(bed,ch,i){dropAll(ch);const b=TD(bed).bed[i];ch.s.pose='sleep';redraw(ch);attach(ch,bed,'sleep'+i,b[0],b[1],'fall');star('sleep');sfx.magic()}
function tryAccept(x,e,p){const d=TD(x),k=TD(e).k;
 if(d.accept&&d.accept(x,e,p))return true;
 if(k==='pet'&&x.t==='petbed')return false;
 if(k==='char'){
  if(d.bed){const a=absXY(x);let best=-1,bd=1e9;d.bed.forEach((b,i)=>{if(kidIn(x,'sleep'+i))return;const dd=Math.abs(a.x+b[0]-p.x);if(dd<bd){bd=dd;best=i}});if(best>=0){sleepOn(x,e,best);return true}}
  if(d.seats){const fl=x.flip?-1:1,a=absXY(x);let best=-1,bd=1e9;d.seats.forEach((s,i)=>{if(kidIn(x,'seat'+i))return;const dd=Math.abs(a.x+s[0]*fl-p.x);if(dd<bd){bd=dd;best=i}});
   if(best>=0){const s=d.seats[best];e.s.pose='sit';redraw(e);reslot(e);attach(e,x,'seat'+best,s[0]*fl,s[1],'fall');star('sit');if(d.sat)d.sat(x,e);return true}}}
 return false}
function eat(who,it){const d=TD(it),isCh=TD(who).k==='char',sid=SID,ok=()=>SID===sid&&byId(who.id)&&byId(it.id);
 if(d.k==='drink'&&!it.s.fill){say(who,'It\'s empty!');if(isCh)hold(who,it,'handR');else place(it);return}
 tr(who).busy=tr(it).busy=1;const sl=isCh?chSlot(who,'mouth',it):{dx:0,dy:-44+d.h/2};attach(it,who,'mouth',sl.dx,sl.dy,'go');setFace(who,isCh?'chew':'yum',1500);
 const fin=()=>{tr(who).busy=0;if(!ok())return;const r=reaction(who,it);
  if(d.k==='drink'){tr(it).busy=0;const cream=it.s.cream;Object.assign(it.s,{fill:0,boba:0,cream:0,rb:0,fx:null,nm:null});redraw(it);
   if(isCh&&!kidIn(who,'handR'))hold(who,it,'handR');else{unpar(it);it.x+=70;place(it)}
   if(cream&&isCh){tr(who).cream=1;redraw(who);setTimeout(()=>{if(SID===sid&&byId(who.id)){tr(who).cream=0;redraw(who)}},9000)}}
  else rm(it);
  doReact(who,r)};
 if(d.k==='drink'){sfx.slurp();setTimeout(()=>ok()&&sfx.slurp(),450);setTimeout(fin,950)}
 else{[0,1,2].forEach(i=>setTimeout(()=>{if(!ok())return;sfx.chomp();anim(who,'chomp',220);EL.get(it.id).firstChild.style.transform=`scale(${[.78,.52,.24][i]})`;const a=absXY(it);crumbs(a.x,a.y-12,(d.food&&d.food.col)||'#f2b880')},260+i*300));setTimeout(fin,1160)}}
function reaction(who,it){const d=TD(it),pet=TD(who).k==='pet';let r=(d.food&&d.food.r)||'yum';if(it.s.fx)r=it.s.fx;

 switch(r){
  case'yuck':F('yuck',2400);sfx.yuck();say(who,pick(['Blech!','Yuck!','Ewww!','Ptooey!']));puff(a.x,hy+50,'#8fd36b',5);star('yuck');break;
  case'spicy':F('spicy',2600);sfx.fire();say(who,'HOT! HOT! HOT!');fireBreath(who);star('spicy');break;

  case'rainbow':F('wow',1500);t.rb=1;redraw(who);sfx.magic();say(who,'Whoa! Rainbow!');sparkle(a.x,hy,10);star('rainbow');later(25000,()=>{tr(who).rb=0;redraw(who)});break;

  default:F('yum',1700);hearts(who,3);sfx.yum();say(who,pick(['Yum!','Mmm!','Tasty!','Delish!','So good!','More please!']))}}

/* ---------- pointer: tap and drag ---------- */
const PTR=new Map();
function spt(ev){const r=$stage.getBoundingClientRect();return{x:(ev.clientX-r.left)/SCALE,y:(ev.clientY-r.top)/SCALE}}

function onDown(ev){if(ev.button>0)return;ac();if(!S||ev.target.closest('.ui'))return;
 const el=ev.target.closest('.ent'),e=el?byId(+el.dataset.id):null,p=spt(ev);
 PTR.set(ev.pointerId,{e,p0:p,p,tg:ev.target,drag:false,cx:ev.clientX,cy:ev.clientY});try{$stage.setPointerCapture(ev.pointerId)}catch(_){}ev.preventDefault()}
function onMove(ev){const P=PTR.get(ev.pointerId);if(!P)return;P.p=spt(ev);P.cx=ev.clientX;P.cy=ev.clientY;if(P.dead)return;
 if(!P.drag){if(Math.hypot(P.p.x-P.p0.x,P.p.y-P.p0.y)<10)return;if(MODE==='paint'||!P.e||!startDrag(P)){P.dead=true;return}}
 dragMove(P)}
function onUp(ev){const P=PTR.get(ev.pointerId);if(!P)return;PTR.delete(ev.pointerId);P.p=spt(ev);P.cx=ev.clientX;P.cy=ev.clientY;
 if(!S)return;if(P.drag)endDrag(P,ev.type==='pointercancel');else if(!P.dead&&ev.type!=='pointercancel')tapAt(P)}
function startDrag(P){let e=P.e;if(!byId(e.id))return false;const d=TD(e);if(tr(e).busy)return false;
 let o=P.p0;if(isFix(e)){if(!d.disp)return false;const n=dispense(e,P.p);if(!n)return false;e=P.e=n;o=P.p}
 if(e.par)unpar(e);P.off={x:e.x-o.x,y:e.y-o.y};beginDrag(P);return true}
function beginDrag(P){const e=P.e,el=EL.get(e.id);P.drag=true;tr(e).drag=1;el.classList.add('drag');el.style.transition='';posE(e);sfx.pick();dragUI(true)}
function dragMove(P){const e=P.e;if(!byId(e.id)){P.dead=true;dragUI(false);return}e.x=clamp(P.p.x+P.off.x,10,W-10);e.y=clamp(P.p.y+P.off.y,30,H+60);posE(e);
 const now=performance.now();if(now-(P.ht||0)>70){P.ht=now;hover(P)}if(S.night&&TD(e).light)updLights()}
function hover(P){const e=P.e,k=TD(e).k;$pack.classList.toggle('open',over($pack,P));$trash.classList.toggle('open',over($trash,P));let tg=null;
 if(k==='food'||k==='drink'){const ex=subIds(e);for(const n of document.elementsFromPoint(P.cx,P.cy)){const en=n.closest&&n.closest('.ent');if(!en)continue;let x=byId(+en.dataset.id);if(!x||ex.has(x.id))continue;
   while(x&&TD(x).k!=='char')x=x.par?byId(x.par):null;if(x){tg=x;break}}}
 if(P.hv!==tg){unHover(P);P.hv=tg;if(tg&&!tr(tg).busy&&tg.s.pose!=='sleep'){tr(tg).face='open';redraw(tg)}}}
function unHover(P){const hv=P.hv;P.hv=null;if(hv&&byId(hv.id)&&tr(hv).face==='open'){tr(hv).face=null;redraw(hv)}}
function endDrag(P,cancel){const e=P.e,el=EL.get(e.id);dragUI(false);unHover(P);if(!el||!byId(e.id))return;el.classList.remove('drag');tr(e).drag=0;posE(e);
 if(!cancel){
  if(over($pack,P)){stash(e);return}
  if(over($trash,P)){trashE(e);return}
  const ex=subIds(e),seen=new Set();
  for(const n of document.elementsFromPoint(P.cx,P.cy)){const en=n.closest&&n.closest('.ent');if(!en)continue;let x=byId(+en.dataset.id);
   while(x){if(!ex.has(x.id)&&!seen.has(x.id)){seen.add(x.id);if(tryAccept(x,e,P.p))return}x=x.par?byId(x.par):null}}}

 let html=`<div class="mh"><div class="big">${IC.star}<b>${n}</b><span>stars</span></div>`+(nx?`<div class="nx"><div class="bar"><i style="width:${Math.min(100,n/nx[0]*100).toFixed(0)}%"></i></div><span><b>${nx[0]-n} more</b> for: ${nx[1]}</span></div>`:`<div class="nx"><span>You unlocked everything. Wow!</span></div>`)+`</div>`;
 html+=`<div class="tabs">`+[`Stickers ${sg}/${STK.length}`,`Pets ${pg}/${pets.length}`,`Minis ${mg}/${MININ.length}`].map((t,i)=>`<button class="tab${i===BT?' on':''}" data-bt="${i}">${t}</button>`).join('')+`</div><div class="body">`;
 if(BT===0)for(const g in STKG){html+=`<h4 style="color:${STKG[g][1]}">${STKG[g][0]}</h4><div class="grid">`+STK.filter(s=>s[3]===g).map(s=>G.st[s[0]]?`<div class="stk got" style="--c:${STKG[g][1]}">${IC.star}<b>${s[1]}</b></div>`:`<div class="stk"><span class="q">?</span><small>${s[2]}</small></div>`).join('')+`</div>`}
 else if(BT===1)html+=`<div class="grid pets">`+pets.map(p=>{const got=G.st['pet_'+p],r=PETS[p].r;return`<div class="pcard${got?' got':''}">${thumb(mk('pet',0,0,petO(p),true))}<b>${got?PETS[p].n:'???'}</b><small>${got?['Common','Uncommon','Super rare'][r]||'Secret friend':(PETHINT[p]||PETHINT[r])}</small></div>`}).join('')+`</div>`;
 else html+=`<div class="grid pets">`+MININ.map((m,i)=>`<div class="pcard${G.minis[i]?' got':''}"><svg class="th" viewBox="-6 -8 68 80">${miniSVG(i)}</svg><b>${G.minis[i]?m:'???'}</b></div>`).join('')+`</div><p class="sub sm">The capsule machine in the Toy Shop gives 3 capsules every day. Collect all 12 minis for a trophy!</p>`;
 showModal(html+`</div>`,'book');$('#modal .tabs').onclick=ev=>{const b=ev.target.closest('.tab');if(b)openBook(+b.dataset.bt)}}

/* ---------- daily gift ---------- */
function claimGift(){const d=G.daily,t=dayN();d.streak=d.last===t-1?d.streak+1:1;d.last=t;const day=(d.streak-1)%7,R=[];
 const egg=r=>R.push(mk('egg',0,0,{s:{r}})),hat=()=>R.push(mk('hat',0,0,{s:{v:pick([1,5,6,7,8,11,13,15,16,17,18])}})),
 sp=()=>{const pool=['lava','rrug','bigted','snow','arcade','starlamp','wand'],gf=G.flags.gf=G.flags.gf||{},left=pool.filter(k=>!gf[k]),k=pick(left.length?left:pool);gf[k]=1;R.push(mk(k,0,0))};
 [()=>egg(0),hat,sp,()=>egg(1),()=>{hat();R.push(mk('lolly',0,0))},sp,()=>{egg(2);hat()}][day]();
 for(const e of R)G.pack.push([e]);star('gift');if(d.streak>=3)star('streak3');if(d.streak>=7)star('streak7');updPack(true);dirty();return R}
function openGift(){if(G.daily.last===dayN()){toast('You already opened today\'s gift. A new one arrives tomorrow!');sfx.nope();return}let taps=0;
 showModal(`<h2>A gift floated in!</h2><div class="giftbox" id="gb">${outline(IC.gift,3)}</div><p class="sub">Tap the present to open it!</p>`,'gift');
 const gb=$('#gb');gb.onclick=()=>{taps++;sfx.boing();gb.classList.remove('shk');void gb.offsetWidth;gb.classList.add('shk');if(taps<3)return;const R=claimGift(),d=G.daily,on=((d.streak-1)%7)+1;sfx.chest();confetti(800,380,34);
  $('#modal .card').innerHTML=`<h2>You got…</h2><div class="rew">`+R.map(e=>`<div class="slot big">${thumb(e)}<em>${nameOf(e)}</em></div>`).join('')+`</div><p class="sub">It's in your backpack!</p><div class="streak">`+[1,2,3,4,5,6,7].map(i=>`<i class="${i<=on?'on':''}">${i===7?IC.star:i}</i>`).join('')+`</div><p class="sub sm">Day ${d.streak} in a row! Come back tomorrow for another gift — day 7 is extra special.</p><button class="btn" id="gok">Yay!</button>`;
  $('#gok').onclick=()=>{closeModal();if(!SID)showMap()}}}

/* ---------- style studio panel ---------- */
function openStyle(ch){STY=ch;$('#stylep').className='ui on';renderStyle()}
function closeStyle(){STY=null;const p=$('#stylep');if(p){p.className='ui';p.innerHTML=''}}
function renderStyle(){const ch=STY,p=$('#stylep');if(!ch||!S||!byId(ch.id)){closeStyle();return}
 p.innerHTML=`<h3>Makeover!</h3><div class="srow"><button data-a="hs-">${IC.left}</button><span>Hair ${ch.s.hs+1}</span><button data-a="hs+">${IC.right}</button></div><div class="srow"><button data-a="of-">${IC.left}</button><span>Outfit ${ch.s.of+1}</span><button data-a="of+">${IC.right}</button></div><div class="lbl">Skin</div><div class="sws">`+SKIN.map(c=>`<button class="swt${ch.c.a===c?' on':''}" data-k="a" data-c="${c}" style="background:${c}"></button>`).join('')+`</div><div class="lbl">Hair colour</div><div class="sws">`+HAIRC.map(c=>`<button class="swt${ch.c.b===c?' on':''}" data-k="b" data-c="${c}" style="background:${c}"></button>`).join('')+`</div><div class="srow2"><button class="btn sm${ch.s.lash?' on':''}" data-a="lash">Lashes</button><button class="btn sm${ch.s.fr?' on':''}" data-a="fr">Freckles</button><button class="btn sm${ch.s.lid!==0?' on':''}" data-a="lid">Sleepy</button><button class="btn sm dice" data-a="rand">${IC.dice}</button></div><p class="sub sm">Tip: the paint brush can colour clothes and shoes too!</p>`;
 p.onclick=ev=>{const b=ev.target.closest('button'),c=STY;if(!b||!c||!byId(c.id))return;const a=b.dataset.a;
  if(b.dataset.k)c.c[b.dataset.k]=b.dataset.c;
  else if(a==='hs+'||a==='hs-'){c.s.hs=(c.s.hs+(a==='hs+'?1:HAIRN-1))%HAIRN;star('style')}
  else if(a==='of+'||a==='of-'){c.s.of=(c.s.of+(a==='of+'?1:OUTN-1))%OUTN;star('style')}
  else if(a==='lash')c.s.lash=c.s.lash?0:1;else if(a==='fr')c.s.fr=c.s.fr?0:1;else if(a==='lid')c.s.lid=c.s.lid===0?1:0;
  else if(a==='rand'){const r=randChar();Object.assign(c.c,r.c);Object.assign(c.s,{hs:r.s.hs,of:r.s.of,lash:r.s.lash,fr:r.s.fr,lid:r.s.lid});star('style');const q=absXY(c);sparkle(q.x,q.y-200,8)}
  redraw(c);anim(c,'land',220);sfx.pop();dirty();renderStyle()}}

/* ---------- telescope & bottle notes ---------- */
const SIGHTART={moon:C(100,100,52,'#fff3a8')+C(82,84,9,'#ffe680')+C(120,116,13,'#ffe680')+C(112,76,6,'#ffe680')+kf(100,104,1.800),
 planet:C(100,100,44,'#9b6bff')+C(84,86,12,'#b794ff')+`<ellipse cx="100" cy="106" rx="76" ry="16" fill="none" stroke="#ffd23f" stroke-width="9"/>`+kf(100,96,1.600),
 shoot:L('M40 150 L130 70','#fff3a8',10)+L('M60 160 L120 106','#fff',5)+P(star5(140,60,30,13),'#ffd23f'),
 rocket:`<g transform="rotate(40 100 100)">`+P('M72 150 Q66 70 100 30 Q134 70 128 150Z','#e9eefb')+P('M84 54 Q100 30 116 54Z','#ff5c7a')+C(100,88,14,'#7ad3ff')+P('M72 150 L52 170 L74 130Z','#ff5c7a')+P('M128 150 L148 170 L126 130Z','#ff5c7a')+P('M86 150 L100 184 L114 150Z','#ffb74d')+`</g>`,
 stars:L('M50 60 L90 90 L130 60 L150 110 L100 140','#7ad3ff',3)+[[50,60],[90,90],[130,60],[150,110],[100,140]].map(([x,y])=>P(star5(x,y,12,5),'#fff3a8')).join(''),
 ufo:P('M70 96 Q70 56 100 56 Q130 56 130 96Z','#c9f0ff')+E(100,104,70,24,'#8d99ae')+E(100,97,70,20,'#b7c0d3')+C(60,104,6,'#ffd23f')+C(100,112,6,'#ff5c7a')+C(140,104,6,'#56d39a')+C(90,80,5,INK)+C(110,80,5,INK)+P('M76 126 L124 126 L150 186 L50 186Z','#b8e986',0,' opacity=".5"')};
function showSight(txt,k){showModal(`<div class="scope"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="98" fill="#1d1f4d"/>${[[30,60],[160,40],[176,140],[36,150],[100,24]].map(([x,y])=>C(x,y,2.500,'#fff')).join('')}${SIGHTART[k]||''}</svg></div><h2>You spotted ${txt}</h2>`,'sight');clearTimeout(sightT);sightT=setTimeout(()=>{if($('#modal').classList.contains('sight'))closeModal()},2800)}
function showHint(){const c=STK.filter(s=>!G.st[s[0]]);showModal(c.length?`<h2>The note says…</h2><p class="note">“${pick(c)[2]}”</p><p class="sub sm">Tap the bottle again for another clue.</p>`:`<h2>The note says…</h2><p class="note">“You found every single secret. You are a Boba Bay legend!”</p>`,'hint')}

/* ---------- map & title ---------- */
const BALLOON=`<svg viewBox="0 0 120 190"><path d="M60 4 Q112 4 112 60 Q112 100 74 128 L46 128 Q8 100 8 60 Q8 4 60 4Z" fill="#ff7aa8"/><path d="M60 4 Q84 30 74 128 L46 128 Q36 30 60 4Z" fill="#ffd23f"/><path d="M48 128 L50 150 M72 128 L70 150" stroke="#8a5a44" stroke-width="3"/><rect x="42" y="148" width="36" height="26" rx="6" fill="#c9a27a"/><g class="gf"><rect x="46" y="132" width="28" height="22" rx="4" fill="#7ad3ff"/><rect x="57" y="132" width="6" height="22" fill="#fff"/><path d="M60 132 Q50 120 48 128 Q50 134 60 132 Q70 134 72 128 Q70 120 60 132Z" fill="#fff"/></g></svg>`;
function showMap(){const m=$('#map');m.className='ui on';$stage.classList.add('onmap');let html=mapSVG();
 for(const s of SPOTS){const open=spotOpen(s);if(s.secret&&!open)continue;html+=`<div class="mlabel${open?'':' lk'}" style="left:${s.x}px;top:${s.y+12}px">${open?'':IC.lock}<span>${s.n}</span>${!open&&s.need?`<b>${s.need}</b>${IC.star}`:''}</div>`}
 const ready=G.daily.last!==dayN();html+=`<button class="gbal${ready?' ready':''}" id="gbal">${outline(BALLOON,5)}<span>${ready?'Gift!':'Tomorrow'}</span></button><div class="mtitle">Boba Bay</div>`;
 m.innerHTML=html;updHud();
 m.onclick=ev=>{const sp=ev.target.closest('[data-go]');if(sp){const s=SPOTS.find(x=>x.id===sp.dataset.go);if(!spotOpen(s)){sfx.nope();toast(s.need?`${s.n} opens when you have ${s.need} stars. You have ${stars()} so far!`:'Just a very tall tree… I wonder what\'s up there? Maybe the park has a clue.');return}sfx.pop();go(s.id);return}
  if(ev.target.closest('[data-whale]')){sfx.splash();const w=m.querySelector('.whale');w.classList.remove('hi');void w.getBoundingClientRect();w.classList.add('hi');if(!G.st.whale){star('whale');setTimeout(()=>!SID&&showMap(),900)}return}
  if(ev.target.closest('#gbal'))openGift()}}
function hideMap(){const m=$('#map');m.className='ui';m.innerHTML='';m.onclick=null;$stage.classList.remove('onmap')}
function showTitle(){const t=$('#title'),cols=['#ff5c7a','#ff8552','#ffd23f','#56d39a','','#7ad3ff','#6c63ff','#d58bff'];t.className='ui on';
 const fig=(e,cls)=>`<div class="tf ${cls||''}">${thumb(e)}</div>`;
 t.innerHTML=`<svg class="tsky" viewBox="0 0 1600 900">${cloud(120,170,1.600)}${cloud(1180,120,1.300)}${cloud(700,60,.9)}</svg><div class="logo">`+'Boba Bay'.split('').map((c,i)=>c===' '?'<i class="sp"></i>':`<i style="animation-delay:${(i*.09).toFixed(2)}s;color:${cols[i]}">${c}</i>`).join('')+`</div><p class="tag">a cozy little world to explore, decorate &amp; discover</p><div class="tchars">`+fig(mk('pet',0,0,petO('bunny'),true),'p')+fig(mk('char',0,0,CH.bro,true))+fig(mk('char',0,0,CH.me,true),'big')+fig(mk('char',0,0,CH.kid,true))+fig(mk('pet',0,0,petO('cat'),true),'p')+fig(mk('pet',0,0,petO('axo'),true),'p')+`</div><button class="btn play" id="play">Play!</button>`;
 $('#play').onclick=()=>{ac();musicOn();sfx.star();t.classList.add('out');setTimeout(()=>{t.className='ui';t.innerHTML=''},450);go('map');if(!G.flags.tut){G.flags.tut=1;dirty();setTimeout(openHelp,500)}}}

/* ---------- start-up ---------- */
function fit(){const w=innerWidth,hh=innerHeight;SCALE=Math.min(w/W,hh/H);$stage.style.transform=`translate(${((w-W*SCALE)/2).toFixed(1)}px,${((hh-H*SCALE)/2).toFixed(1)}px) scale(${SCALE.toFixed(4)})`}
function boot(){G=loadG();G.pack=G.pack.filter(a=>a&&a.length&&a.every(e=>T[e.t]));
 $stage=$('#stage');$bg=$('#bg');$ents=$('#ents');$fx=$('#fx');$lights=$('#lights');$pack=$('#pack');$trash=$('#trash');
 $('#b-map').innerHTML=IC.map;$('#b-set').innerHTML=IC.gear;$('#b-paint').innerHTML=IC.brush;$('#b-cat').innerHTML=IC.sofa;$('#b-stars').innerHTML=IC.star+'<b>0</b>';$pack.innerHTML=outline(IC.bag,3.4)+'<span class="badge"></span>';$trash.innerHTML=IC.trash;
 $('#b-map').onclick=()=>{sfx.pop();go('map')};$('#b-set').onclick=openSettings;$('#b-stars').onclick=()=>openBook();$('#b-paint').onclick=()=>openTray('paint');$('#b-cat').onclick=()=>openTray('cat');$pack.onclick=()=>openTray('pack');
 $('#nav-l').onclick=()=>{const n=SC[SID].nav;if(n&&n.l)go(n.l)};$('#nav-r').onclick=()=>{const n=SC[SID].nav;if(n&&n.r)go(n.r)};
 $stage.addEventListener('pointerdown',onDown);window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onUp);
 window.addEventListener('resize',fit);window.addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
 document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
 document.addEventListener('visibilitychange',()=>{if(document.hidden)saveG()});window.addEventListener('pagehide',saveG);
 setInterval(tick,250);updHud();showTitle()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

</script>
