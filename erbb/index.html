}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;erbb-v6-explorer&quot;&gt;
  &lt;div class=&quot;ev6-heading&quot;&gt;
    &lt;h1&gt;ErbB v6 steady-state model&lt;/h1&gt;

      &lt;output id=&quot;ev6-phi-out&quot; class=&quot;tabular-nums&quot;&gt;&lt;/output&gt;
      &lt;input id=&quot;ev6-phi&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;3.0004&quot; step=&quot;0.002&quot; value=&quot;0.30103&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;ev6-alpha&quot;&gt;
      &lt;span&gt;Association strength, α = k&lt;sub&gt;+&lt;/sub&gt;R&lt;sub&gt;T&lt;/sub&gt;/k&lt;sub&gt;d&lt;/sub&gt;&lt;/span&gt;
      &lt;output id=&quot;ev6-alpha-out&quot; class=&quot;tabular-nums&quot;&gt;&lt;/output&gt;
      &lt;input id=&quot;ev6-alpha&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-3&quot; max=&quot;6&quot; step=&quot;0.01&quot; value=&quot;1&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;ev6-delta&quot;&gt;
      &lt;span&gt;Ligand loss / dimer dissociation, δ = k&lt;sub&gt;off&lt;/sub&gt;/k&lt;sub&gt;d&lt;/sub&gt;&lt;/span&gt;
      &lt;output id=&quot;ev6-delta-out&quot; class=&quot;tabular-nums&quot;&gt;&lt;/output&gt;
      &lt;input id=&quot;ev6-delta&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.01&quot; value=&quot;1&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;ev6-dose&quot;&gt;
      &lt;span&gt;Selected ligand dose, ℓ = L/K&lt;sub&gt;D&lt;/sub&gt;&lt;/span&gt;
      &lt;output id=&quot;ev6-dose-out&quot; class=&quot;tabular-nums&quot;&gt;&lt;/output&gt;
      &lt;input id=&quot;ev6-dose&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-4&quot; max=&quot;3&quot; step=&quot;0.01&quot; value=&quot;0&quot;&gt;
    &lt;/label&gt;
    &lt;button id=&quot;ev6-reset&quot; class=&quot;btn btn-ghost&quot; type=&quot;button&quot;&gt;Reset v6 defaults&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ev6-derived text-small text-muted tabular-nums&quot; aria-live=&quot;polite&quot;&gt;
    Γ&lt;sub&gt;1&lt;/sub&gt; = &lt;span id=&quot;ev6-g1&quot;&gt;&lt;/span&gt;
    &lt;span aria-hidden=&quot;true&quot;&gt;·&lt;/span&gt;
    Γ&lt;sub&gt;2&lt;/sub&gt; = &lt;span id=&quot;ev6-g2&quot;&gt;&lt;/span&gt;
    &lt;span aria-hidden=&quot;true&quot;&gt;·&lt;/span&gt;
    occupancy f = &lt;span id=&quot;ev6-f&quot;&gt;&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ev6-metric-note text-small&quot;&gt;
    &lt;strong&gt;Common observable:&lt;/strong&gt; Y = p + 2q, the fraction of ligand-binding primary receptors that are both ligand-bound and productively dimerized. Y = 1 means 100 engaged receptor protomers; for a pure self-homodimer system, that is 50 physical dimers—not 100.
  &lt;/div&gt;

  &lt;div class=&quot;viz-grid ev6-stats&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;Current ligand-bound receptor participation, Y&lt;/div&gt;
      &lt;div id=&quot;ev6-current-value&quot; class=&quot;viz-stat-value tabular-nums&quot;&gt;&lt;/div&gt;
      &lt;div id=&quot;ev6-current-note&quot; class=&quot;text-small&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;HER2 increment in Y&lt;/div&gt;
      &lt;div id=&quot;ev6-gain-value&quot; class=&quot;viz-stat-value tabular-nums&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;card viz-stat&quot;&gt;

      &lt;div id=&quot;ev6-biv-value&quot; class=&quot;viz-stat-value tabular-nums&quot;&gt;&lt;/div&gt;

        &lt;button class=&quot;btn btn-ghost ev6-series-toggle&quot; type=&quot;button&quot; data-series=&quot;dose-mono&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;ev6-swatch ev6-mono&quot;&gt;&lt;/span&gt;Monomer search, no HER2: Y = 2q&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost ev6-series-toggle&quot; type=&quot;button&quot; data-series=&quot;dose-current&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;ev6-swatch ev6-current&quot;&gt;&lt;/span&gt;Current HER2 ratio: Y = p + 2q&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost ev6-series-toggle&quot; type=&quot;button&quot; data-series=&quot;dose-biv&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;ev6-swatch ev6-biv&quot;&gt;&lt;/span&gt;Bivalent ligand&lt;/button&gt;

        &lt;button class=&quot;btn btn-ghost ev6-series-toggle&quot; type=&quot;button&quot; data-series=&quot;tit-hetero&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;ev6-swatch ev6-hetero&quot;&gt;&lt;/span&gt;HER2 heterodimer participation: p&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost ev6-series-toggle&quot; type=&quot;button&quot; data-series=&quot;tit-homo&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;ev6-swatch ev6-mono&quot;&gt;&lt;/span&gt;Self-homodimer participation: 2q&lt;/button&gt;
        &lt;button class=&quot;btn btn-ghost ev6-series-toggle&quot; type=&quot;button&quot; data-series=&quot;tit-pre&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;ev6-swatch ev6-pre&quot;&gt;&lt;/span&gt;Invertebrate preformed-dimer ceiling: f&lt;/button&gt;

  #erbb-v6-explorer .ev6-chart .ev6-muted-text {
    fill: var(--muted-foreground);
  }

  #erbb-v6-explorer .ev6-chart .ev6-grid {
    stroke: var(--border);
    stroke-width: 1;
  }

  #erbb-v6-explorer .ev6-chart .ev6-frame {
    fill: none;
    stroke: var(--border);
    stroke-width: 1;
  }

  #erbb-v6-explorer .ev6-chart .ev6-guide {
    stroke: var(--muted-foreground);
    stroke-width: 1;
    pointer-events: none;
  }

  #erbb-v6-explorer .ev6-chart .ev6-marker {
    stroke: var(--background);
    stroke-width: 1.5;
    pointer-events: none;
  }

  #erbb-v6-explorer .ev6-tooltip {
    position: absolute;
    z-index: 10;
    max-width: 270px;
    pointer-events: none;
  }

  #erbb-v6-explorer .ev6-tooltip table {
    border-collapse: collapse;
  }

  #erbb-v6-explorer .ev6-tooltip td:last-child {
    padding-left: 0.8rem;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  @media (max-width: 760px) {
    #erbb-v6-explorer .ev6-plots {
      grid-template-columns: minmax(0, 1fr);
    }

    #erbb-v6-explorer .ev6-chart {
      min-height: 340px;
    }

    #erbb-v6-explorer .ev6-heat-chart {
      min-height: 390px;
    }

    #erbb-v6-explorer .ev6-heat-key {
      grid-template-columns: auto minmax(80px, 1fr) auto;
    }

    #erbb-v6-explorer .ev6-heat-key .text-small {
      grid-column: 1 / -1;
    }
  }
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;erbb-v6-explorer&#x27;);
  if (!root || root.dataset.ready === &#x27;true&#x27;) return;
  root.dataset.ready = &#x27;true&#x27;;

  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  const byId = id =&gt; document.getElementById(id);
  const controls = {
    phi: byId(&#x27;ev6-phi&#x27;),
    alpha: byId(&#x27;ev6-alpha&#x27;),
    delta: byId(&#x27;ev6-delta&#x27;),
    dose: byId(&#x27;ev6-dose&#x27;),
    heatOccupancy: byId(&#x27;ev6-heat-occupancy&#x27;)
  };
  const visible = {
    &#x27;dose-pre&#x27;: true,
    &#x27;dose-mono&#x27;: true,
    &#x27;dose-current&#x27;: true,
    &#x27;dose-biv&#x27;: true,
    &#x27;tit-total&#x27;: true,
    &#x27;tit-hetero&#x27;: true,
    &#x27;tit-homo&#x27;: true,
    &#x27;tit-pre&#x27;: true
  };
  const tooltip = byId(&#x27;ev6-tooltip&#x27;);
  let currentState = null;

  function svgEl(name, attrs = {}, textValue = &#x27;&#x27;) {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
    if (textValue !== &#x27;&#x27;) node.textContent = textValue;
    return node;
  }

  function clamp(value, lo, hi) {
    return Math.max(lo, Math.min(hi, value));
  }

  function formatNumber(value) {
    if (!Number.isFinite(value)) return &#x27;—&#x27;;
    const abs = Math.abs(value);
    if (abs === 0) return &#x27;0&#x27;;
    if (abs &lt; 0.001 || abs &gt;= 1000) return value.toExponential(2);
    if (abs &lt; 0.1) return value.toFixed(3);
    if (abs &lt; 10) return value.toFixed(2);
    return value.toFixed(1);
  }

  function readState() {
    return {
      phi: Math.pow(10, Number(controls.phi.value)) - 1,
      alpha: Math.pow(10, Number(controls.alpha.value)),
      delta: Math.pow(10, Number(controls.delta.value)),
      dose: Math.pow(10, Number(controls.dose.value))
    };
  }

  function gammas(state) {
    return {
      gamma1: state.alpha / (1 + state.delta),
      gamma2: state.alpha / (1 + 2 * state.delta)
    };
  }

  function mainState(ell, state, phi = state.phi) {
    const {gamma1, gamma2} = gammas(state);
    const f = ell / (1 + ell);
    let lo = 0;
    let hi = f;
    for (let i = 0; i &lt; 90; i += 1) {
      const c = 0.5 * (lo + hi);
      const p = gamma1 * phi * c / (1 + gamma1 * c);
      const q = gamma2 * c * c;
      if (c + p + 2 * q &gt; f) hi = c;
      else lo = c;
    }
    const c = 0.5 * (lo + hi);
    const p = gamma1 * phi * c / (1 + gamma1 * c);
    const q = gamma2 * c * c;
    return {
      f,
      c,
      p,
      q,
      participation: p + 2 * q
    };
  }

  function bivalentState(ell, state) {
    const {gamma1} = gammas(state);
    let lo = 0;
    let hi = 1;
    for (let i = 0; i &lt; 90; i += 1) {
      const r = 0.5 * (lo + hi);
      const residual = gamma1 * (1 + 2 * ell) * r * r + (1 + ell - gamma1) * r - 1;
      if (residual &gt; 0) hi = r;
      else lo = r;
    }
    const r = 0.5 * (lo + hi);
    const c = ell * r / (1 + gamma1 * r);
    const d = gamma1 * c * r;
    return {r, c, d};
  }

  function outputValue(model) {
    return model.participation;
  }

  function outputLabel() {
    return &#x27;fraction of primary receptors ligand-bound and dimer-engaged, Y = p + 2q&#x27;;
  }

  function updateReadouts(state) {
    const {gamma1, gamma2} = gammas(state);
    const model = mainState(state.dose, state);
    const baseline = mainState(state.dose, state, 0);
    const biv = bivalentState(state.dose, state);
    const current = outputValue(model);
    const base = outputValue(baseline);
    const gain = current - base;

    byId(&#x27;ev6-phi-out&#x27;).textContent = formatNumber(state.phi);
    byId(&#x27;ev6-alpha-out&#x27;).textContent = formatNumber(state.alpha);
    byId(&#x27;ev6-delta-out&#x27;).textContent = formatNumber(state.delta);
    byId(&#x27;ev6-dose-out&#x27;).textContent = formatNumber(state.dose);
    byId(&#x27;ev6-g1&#x27;).textContent = formatNumber(gamma1);
    byId(&#x27;ev6-g2&#x27;).textContent = formatNumber(gamma2);
    byId(&#x27;ev6-f&#x27;).textContent = formatNumber(model.f);

    byId(&#x27;ev6-current-value&#x27;).textContent = formatNumber(current);
    byId(&#x27;ev6-current-note&#x27;).textContent = `${formatNumber(100 * current / Math.max(model.f, 1e-15))}% of the preformed-dimer ceiling. Per 100 primary receptors: ${formatNumber(100 * model.p)} HER2 heterodimers + ${formatNumber(100 * model.q)} self-homodimers; ${formatNumber(100 * model.c)} ligand-bound monomers remain.`;
    byId(&#x27;ev6-gain-value&#x27;).textContent = `${gain &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${formatNumber(gain)}`;
    byId(&#x27;ev6-gain-note&#x27;).textContent = `${formatNumber(100 * gain)} additional ligand-bound receptors dimerized per 100 primary receptors; no-HER2 Y₀=${formatNumber(base)}, corresponding to ${formatNumber(100 * baseline.q)} physical self-homodimers.`;
    byId(&#x27;ev6-biv-value&#x27;).textContent = formatNumber(biv.d);
    byId(&#x27;ev6-biv-note&#x27;).textContent = `${formatNumber(100 * biv.d / Math.max(model.f, 1e-15))}% of the preformed-dimer ceiling`;
  }

  function makeScales(width, height, xMin, xMax) {
    const narrow = width &lt; 500;
    const margin = {top: 16, right: 16, bottom: 66, left: narrow ? 62 : 72};
    const innerW = Math.max(80, width - margin.left - margin.right);
    const innerH = Math.max(120, height - margin.top - margin.bottom);
    return {
      margin,
      innerW,
      innerH,
      x: value =&gt; margin.left + (value - xMin) / (xMax - xMin) * innerW,
      y: value =&gt; margin.top + innerH - value / 1.02 * innerH,
      invertX: px =&gt; xMin + (px - margin.left) / innerW * (xMax - xMin)
    };
  }

  function addAxes(svg, scales, width, height, xTicks, xFormatter, xTitle, yTitle) {
    const {margin, innerW, innerH, x, y} = scales;
    const yTicks = [0, 0.25, 0.5, 0.75, 1];
    yTicks.forEach(value =&gt; {
      const yy = y(value);
      svg.appendChild(svgEl(&#x27;line&#x27;, {x1: margin.left, x2: margin.left + innerW, y1: yy, y2: yy, class: &#x27;ev6-grid&#x27;}));
      svg.appendChild(svgEl(&#x27;text&#x27;, {x: margin.left - 9, y: yy + 4, &#x27;text-anchor&#x27;: &#x27;end&#x27;, class: &#x27;ev6-muted-text&#x27;}, value.toFixed(value === 0 || value === 1 ? 1 : 2)));
    });
    xTicks.forEach(value =&gt; {
      const xx = x(value);
      svg.appendChild(svgEl(&#x27;line&#x27;, {x1: xx, x2: xx, y1: margin.top, y2: margin.top + innerH, class: &#x27;ev6-grid&#x27;}));
      svg.appendChild(svgEl(&#x27;text&#x27;, {x: xx, y: margin.top + innerH + 22, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;ev6-muted-text&#x27;}, xFormatter(value)));
    });
    svg.appendChild(svgEl(&#x27;rect&#x27;, {x: margin.left, y: margin.top, width: innerW, height: innerH, class: &#x27;ev6-frame&#x27;, &#x27;data-chart-frame&#x27;: &#x27;true&#x27;}));
    svg.appendChild(svgEl(&#x27;text&#x27;, {x: margin.left + innerW / 2, y: height - 14, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, class: &#x27;axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;x&#x27;}, xTitle));
    const yText = svgEl(&#x27;text&#x27;, {x: 16, y: margin.top + innerH / 2, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, transform: `rotate(-90 16 ${margin.top + innerH / 2})`, class: &#x27;axis-title&#x27;, &#x27;data-axis&#x27;: &#x27;y&#x27;}, yTitle);
    svg.appendChild(yText);
  }

  function linePath(points, scales) {
    return points.map((point, index) =&gt; `${index === 0 ? &#x27;M&#x27; : &#x27;L&#x27;}${scales.x(point.x).toFixed(2)},${scales.y(point.y).toFixed(2)}`).join(&#x27; &#x27;);
  }

  function seriesPath(svg, points, scales, color, dash = &#x27;&#x27;, width = 2.2) {
    const path = svgEl(&#x27;path&#x27;, {
      d: linePath(points, scales),
      fill: &#x27;none&#x27;,
      stroke: color,
      &#x27;stroke-width&#x27;: width,
      &#x27;stroke-dasharray&#x27;: dash,
      &#x27;vector-effect&#x27;: &#x27;non-scaling-stroke&#x27;
    });
    svg.appendChild(path);
    return path;
  }

  function tooltipTable(title, rows) {
    return `&lt;strong&gt;${title}&lt;/strong&gt;&lt;table&gt;${rows.map(row =&gt; `&lt;tr&gt;&lt;td&gt;${row[0]}&lt;/td&gt;&lt;td&gt;${row[1]}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;/table&gt;`;
  }

  function placeTooltip(event) {
    const rootRect = root.getBoundingClientRect();
    const tipRect = tooltip.getBoundingClientRect();
    let left = event.clientX - rootRect.left + 14;
    let top = event.clientY - rootRect.top + 14;
    left = clamp(left, 4, Math.max(4, rootRect.width - tipRect.width - 4));
    top = clamp(top, 4, Math.max(4, rootRect.height - tipRect.height - 4));
    tooltip.style.left = `${left}px`;
    tooltip.style.top = `${top}px`;
  }

  function drawDoseChart(state) {
    const host = byId(&#x27;ev6-dose-chart&#x27;);
    const width = Math.max(320, Math.floor(host.getBoundingClientRect().width || 620));
    const height = width &lt; 500 ? 350 : 390;
    host.replaceChildren();
    const svg = svgEl(&#x27;svg&#x27;, {viewBox: `0 0 ${width} ${height}`, role: &#x27;img&#x27;, &#x27;aria-label&#x27;: &#x27;Ligand-bound receptor participation for the invertebrate preformed-dimer reference, no-HER2 monomer search, HER2-assisted search, and bivalent ligand&#x27;});
    svg.appendChild(svgEl(&#x27;title&#x27;, {}, &#x27;ErbB v6 dose response&#x27;));
    svg.appendChild(svgEl(&#x27;desc&#x27;, {}, &#x27;Absolute model output as a function of dimensionless ligand concentration.&#x27;));
    host.appendChild(svg);
    const scales = makeScales(width, height, -4, 3);
    addAxes(svg, scales, width, height, [-4, -2, 0, 2, 3], value =&gt; `10${value === 0 ? &#x27;⁰&#x27; : value === 2 ? &#x27;²&#x27; : value === 3 ? &#x27;³&#x27; : value === -2 ? &#x27;⁻²&#x27; : &#x27;⁻⁴&#x27;}`, &#x27;dimensionless ligand, ℓ = L/KD&#x27;, outputLabel());

    const definitions = [
      {key: &#x27;dose-pre&#x27;, color: &#x27;var(--foreground)&#x27;, dash: &#x27;&#x27;, fn: ell =&gt; ell / (1 + ell)},
      {key: &#x27;dose-mono&#x27;, color: &#x27;var(--viz-series-2)&#x27;, dash: &#x27;8 5&#x27;, fn: ell =&gt; outputValue(mainState(ell, state, 0))},
      {key: &#x27;dose-current&#x27;, color: &#x27;var(--viz-series-1)&#x27;, dash: &#x27;&#x27;, fn: ell =&gt; outputValue(mainState(ell, state))},
      {key: &#x27;dose-biv&#x27;, color: &#x27;var(--viz-series-3)&#x27;, dash: &#x27;3 4&#x27;, fn: ell =&gt; bivalentState(ell, state).d}
    ];
    const samples = Array.from({length: 281}, (_, i) =&gt; -4 + 7 * i / 280);
    definitions.forEach(def =&gt; {
      if (!visible[def.key]) return;
      const points = samples.map(logEll =&gt; ({x: logEll, y: def.fn(Math.pow(10, logEll))}));
      seriesPath(svg, points, scales, def.color, def.dash, def.key === &#x27;dose-current&#x27; ? 2.8 : 2.1);
    });

    const selectedX = scales.x(Math.log10(state.dose));
    svg.appendChild(svgEl(&#x27;line&#x27;, {x1: selectedX, x2: selectedX, y1: scales.margin.top, y2: scales.margin.top + scales.innerH, class: &#x27;ev6-guide&#x27;, &#x27;stroke-dasharray&#x27;: &#x27;3 4&#x27;}));
    const hoverGuide = svgEl(&#x27;line&#x27;, {x1: selectedX, x2: selectedX, y1: scales.margin.top, y2: scales.margin.top + scales.innerH, class: &#x27;ev6-guide&#x27;, opacity: 0, &#x27;data-chart-hover-guide&#x27;: &#x27;true&#x27;});
    svg.appendChild(hoverGuide);
    const markers = definitions.map(def =&gt; {
      const marker = svgEl(&#x27;circle&#x27;, {r: 4, fill: def.color, class: &#x27;ev6-marker&#x27;, opacity: 0, &#x27;data-chart-hover-marker&#x27;: def.key});
      svg.appendChild(marker);
      return {def, marker};
    });
    const overlay = svgEl(&#x27;rect&#x27;, {x: scales.margin.left, y: scales.margin.top, width: scales.innerW, height: scales.innerH, fill: &#x27;transparent&#x27;, &#x27;data-chart-hit&#x27;: &#x27;true&#x27;, &#x27;data-chart-hover-overlay&#x27;: &#x27;cross-series&#x27;});
    overlay.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
      const rect = svg.getBoundingClientRect();
      const scaleFactor = width / rect.width;
      const px = (event.clientX - rect.left) * scaleFactor;
      const logEll = clamp(scales.invertX(px), -4, 3);
      const ell = Math.pow(10, logEll);
      const xx = scales.x(logEll);
      hoverGuide.setAttribute(&#x27;x1&#x27;, xx);
      hoverGuide.setAttribute(&#x27;x2&#x27;, xx);
      hoverGuide.setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
      const rows = [];
      markers.forEach(({def, marker}) =&gt; {
        if (!visible[def.key]) {
          marker.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;);
          return;
        }
        const value = def.fn(ell);
        marker.setAttribute(&#x27;cx&#x27;, xx);
        marker.setAttribute(&#x27;cy&#x27;, scales.y(value));
        marker.setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
        const labels = {&#x27;dose-pre&#x27;: &#x27;Invertebrate preformed dimer&#x27;, &#x27;dose-mono&#x27;: &#x27;Monomer search, no HER2&#x27;, &#x27;dose-current&#x27;: `Current HER2 ratio φ=${formatNumber(state.phi)}`, &#x27;dose-biv&#x27;: &#x27;Bivalent ligand&#x27;};
        rows.push([labels[def.key], formatNumber(value)]);
      });
      tooltip.innerHTML = tooltipTable(`ℓ = ${formatNumber(ell)}`, rows);
      tooltip.hidden = false;
      placeTooltip(event);
    });
    overlay.addEventListener(&#x27;pointerleave&#x27;, () =&gt; {
      hoverGuide.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;);
      markers.forEach(({marker}) =&gt; marker.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;));
      tooltip.hidden = true;
    });
    svg.appendChild(overlay);
  }

  function drawTitrationChart(state) {
    const host = byId(&#x27;ev6-titration-chart&#x27;);
    const width = Math.max(320, Math.floor(host.getBoundingClientRect().width || 520));
    const height = width &lt; 500 ? 350 : 390;
    host.replaceChildren();
    const svg = svgEl(&#x27;svg&#x27;, {viewBox: `0 0 ${width} ${height}`, role: &#x27;img&#x27;, &#x27;aria-label&#x27;: &#x27;Partner titration showing total, heterodimer, and homodimer contributions&#x27;});
    svg.appendChild(svgEl(&#x27;title&#x27;, {}, &#x27;Partner titration&#x27;));
    svg.appendChild(svgEl(&#x27;desc&#x27;, {}, &#x27;Model output and pathway contributions as HER2 or partner abundance increases.&#x27;));
    host.appendChild(svg);
    const xMax = Math.log10(1001);
    const scales = makeScales(width, height, 0, xMax);
    const tickPhi = [0, 1, 10, 100, 1000];
    const xTicks = tickPhi.map(phi =&gt; Math.log10(1 + phi));
    addAxes(svg, scales, width, height, xTicks, value =&gt; String(tickPhi[xTicks.indexOf(value)]), &#x27;HER2 / partner ratio, φ (log spacing in 1 + φ)&#x27;, outputLabel());
    const definitions = [
      {key: &#x27;tit-total&#x27;, color: &#x27;var(--viz-series-1)&#x27;, dash: &#x27;&#x27;, fn: phi =&gt; outputValue(mainState(state.dose, state, phi))},
      {key: &#x27;tit-hetero&#x27;, color: &#x27;var(--viz-series-4)&#x27;, dash: &#x27;7 4&#x27;, fn: phi =&gt; mainState(state.dose, state, phi).p},
      {key: &#x27;tit-homo&#x27;, color: &#x27;var(--viz-series-2)&#x27;, dash: &#x27;3 4&#x27;, fn: phi =&gt; 2 * mainState(state.dose, state, phi).q},
      {key: &#x27;tit-pre&#x27;, color: &#x27;var(--foreground)&#x27;, dash: &#x27;&#x27;, fn: () =&gt; state.dose / (1 + state.dose)}
    ];
    const samples = Array.from({length: 281}, (_, i) =&gt; xMax * i / 280);
    definitions.forEach(def =&gt; {
      if (!visible[def.key]) return;
      const points = samples.map(logOnePlusPhi =&gt; ({x: logOnePlusPhi, y: def.fn(Math.pow(10, logOnePlusPhi) - 1)}));
      seriesPath(svg, points, scales, def.color, def.dash, def.key === &#x27;tit-total&#x27; ? 2.8 : 2.1);
    });

    const currentX = scales.x(Math.log10(1 + state.phi));
    svg.appendChild(svgEl(&#x27;line&#x27;, {x1: currentX, x2: currentX, y1: scales.margin.top, y2: scales.margin.top + scales.innerH, class: &#x27;ev6-guide&#x27;, &#x27;stroke-dasharray&#x27;: &#x27;3 4&#x27;}));
    const hoverGuide = svgEl(&#x27;line&#x27;, {x1: currentX, x2: currentX, y1: scales.margin.top, y2: scales.margin.top + scales.innerH, class: &#x27;ev6-guide&#x27;, opacity: 0, &#x27;data-chart-hover-guide&#x27;: &#x27;true&#x27;});
    svg.appendChild(hoverGuide);
    const markers = definitions.map(def =&gt; {
      const marker = svgEl(&#x27;circle&#x27;, {r: 4, fill: def.color, class: &#x27;ev6-marker&#x27;, opacity: 0, &#x27;data-chart-hover-marker&#x27;: def.key});
      svg.appendChild(marker);
      return {def, marker};
    });
    const overlay = svgEl(&#x27;rect&#x27;, {x: scales.margin.left, y: scales.margin.top, width: scales.innerW, height: scales.innerH, fill: &#x27;transparent&#x27;, &#x27;data-chart-hit&#x27;: &#x27;true&#x27;, &#x27;data-chart-hover-overlay&#x27;: &#x27;cross-series&#x27;});
    overlay.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
      const rect = svg.getBoundingClientRect();
      const scaleFactor = width / rect.width;
      const px = (event.clientX - rect.left) * scaleFactor;
      const xValue = clamp(scales.invertX(px), 0, xMax);
      const phi = Math.pow(10, xValue) - 1;
      const xx = scales.x(xValue);
      hoverGuide.setAttribute(&#x27;x1&#x27;, xx);
      hoverGuide.setAttribute(&#x27;x2&#x27;, xx);
      hoverGuide.setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
      const rows = [];
      markers.forEach(({def, marker}) =&gt; {
        if (!visible[def.key]) {
          marker.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;);
          return;
        }
        const value = def.fn(phi);
        marker.setAttribute(&#x27;cx&#x27;, xx);
        marker.setAttribute(&#x27;cy&#x27;, scales.y(value));
        marker.setAttribute(&#x27;opacity&#x27;, &#x27;1&#x27;);
        const labels = {&#x27;tit-total&#x27;: &#x27;Total Y=p+2q&#x27;, &#x27;tit-hetero&#x27;: &#x27;HER2 contribution p&#x27;, &#x27;tit-homo&#x27;: &#x27;Self-homodimer contribution 2q&#x27;, &#x27;tit-pre&#x27;: &#x27;Invertebrate preformed-dimer Y=f&#x27;};
        rows.push([labels[def.key], formatNumber(value)]);
      });
      tooltip.innerHTML = tooltipTable(`φ = ${formatNumber(phi)}`, rows);
      tooltip.hidden = false;
      placeTooltip(event);
    });
    overlay.addEventListener(&#x27;pointerleave&#x27;, () =&gt; {
      hoverGuide.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;);
      markers.forEach(({marker}) =&gt; marker.setAttribute(&#x27;opacity&#x27;, &#x27;0&#x27;));
      tooltip.hidden = true;
    });
    svg.appendChild(overlay);
  }

  function heatOccupancy(state) {
    return controls.heatOccupancy.value === &#x27;current&#x27;
      ? state.dose / (1 + state.dose)
      : Number(controls.heatOccupancy.value);
  }

  function heatValues(eta, phi, occupancy, state) {
    const ell = occupancy / Math.max(1 - occupancy, 1e-12);
    const heatState = {...state, alpha: eta * state.delta};
    const baseline = mainState(ell, heatState, 0).participation;
    const assisted = mainState(ell, heatState, phi).participation;
    const increment = Math.max(0, assisted - baseline);
    return {
      baseline,
      assisted,
      increment,
      perHundredBound: 100 * increment / Math.max(occupancy, 1e-12)
    };
  }

  function interpolateHeatColor(value) {
    const stops = [
      [0, [7, 47, 95]],
      [25, [51, 79, 120]],
      [50, [127, 127, 127]],
      [75, [199, 182, 95]],
      [100, [254, 227, 59]]
    ];
    const v = clamp(value, 0, 100);
    let lower = stops[0];
    let upper = stops[stops.length - 1];
    for (let i = 1; i &lt; stops.length; i += 1) {
      if (v &lt;= stops[i][0]) {
        lower = stops[i - 1];
        upper = stops[i];
        break;
      }
    }
    const t = (v - lower[0]) / Math.max(upper[0] - lower[0], 1e-12);
    const rgb = lower[1].map((channel, i) =&gt; Math.round(channel + t * (upper[1][i] - channel)));
    return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
  }

  function contourSegments(values, nx, ny, threshold) {
    const segments = [];
    const at = (i, j) =&gt; values[j * (nx + 1) + i];
    const interp = (a, b) =&gt; {
      if (Math.abs(b - a) &lt; 1e-12) return 0.5;
      return clamp((threshold - a) / (b - a), 0, 1);
    };
    for (let j = 0; j &lt; ny; j += 1) {
      for (let i = 0; i &lt; nx; i += 1) {
        const v00 = at(i, j);
        const v10 = at(i + 1, j);
        const v11 = at(i + 1, j + 1);
        const v01 = at(i, j + 1);
        const code = (v00 &gt;= threshold ? 1 : 0)
          | (v10 &gt;= threshold ? 2 : 0)
          | (v11 &gt;= threshold ? 4 : 0)
          | (v01 &gt;= threshold ? 8 : 0);
        if (code === 0 || code === 15) continue;
        const edge = {
          bottom: [i + interp(v00, v10), j],
          right: [i + 1, j + interp(v10, v11)],
          top: [i + interp(v01, v11), j + 1],
          left: [i, j + interp(v00, v01)]
        };
        const add = (a, b) =&gt; segments.push([edge[a], edge[b]]);
        const cases = {
          1: [[&#x27;bottom&#x27;, &#x27;left&#x27;]], 2: [[&#x27;bottom&#x27;, &#x27;right&#x27;]], 3: [[&#x27;left&#x27;, &#x27;right&#x27;]],
          4: [[&#x27;right&#x27;, &#x27;top&#x27;]], 5: [[&#x27;bottom&#x27;, &#x27;right&#x27;], [&#x27;left&#x27;, &#x27;top&#x27;]],
          6: [[&#x27;bottom&#x27;, &#x27;top&#x27;]], 7: [[&#x27;left&#x27;, &#x27;top&#x27;]], 8: [[&#x27;top&#x27;, &#x27;left&#x27;]],
          9: [[&#x27;bottom&#x27;, &#x27;top&#x27;]], 10: [[&#x27;bottom&#x27;, &#x27;left&#x27;], [&#x27;right&#x27;, &#x27;top&#x27;]],
          11: [[&#x27;right&#x27;, &#x27;top&#x27;]], 12: [[&#x27;left&#x27;, &#x27;right&#x27;]], 13: [[&#x27;bottom&#x27;, &#x27;right&#x27;]],
          14: [[&#x27;bottom&#x27;, &#x27;left&#x27;]]
        };
        (cases[code] || []).forEach(pair =&gt; add(pair[0], pair[1]));
      }
    }
    return segments;

  function drawHeatmap(state) {
    const host = byId(&#x27;ev6-heat-chart&#x27;);

    const height = width &lt; 500 ? 390 : 470;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const canvas = document.createElement(&#x27;canvas&#x27;);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    canvas.setAttribute(&#x27;role&#x27;, &#x27;img&#x27;);
    canvas.setAttribute(&#x27;aria-label&#x27;, &#x27;Heat map of the HER2 benefit across monomer-search opportunities and HER2 abundance&#x27;);

    ctx.scale(dpr, dpr);
    const narrow = width &lt; 500;
    const margin = {top: 16, right: 18, bottom: 78, left: narrow ? 68 : 84};
    const plotW = width - margin.left - margin.right;
    const plotH = height - margin.top - margin.bottom;
    const xMin = -3;
    const xMax = 3;
    const yMin = 0;
    const yMax = Math.log10(1001);
    const xPx = logEta =&gt; margin.left + (logEta - xMin) / (xMax - xMin) * plotW;

        const v10 = values[j * (nx + 1) + i + 1];

        const v11 = values[(j + 1) * (nx + 1) + i + 1];
        ctx.fillStyle = interpolateHeatColor(0.25 * (v00 + v10 + v01 + v11));

        const right = margin.left + plotW * (i + 1) / nx;
        const bottom = margin.top + plotH - plotH * j / ny;
        const top = margin.top + plotH - plotH * (j + 1) / ny;

    ctx.beginPath();
    ctx.rect(margin.left, margin.top, plotW, plotH);

      segments.forEach(segment =&gt; {

        const ay = margin.top + plotH - plotH * segment[0][1] / ny;

    const selectedY = yPx(Math.log10(1 + selectedPhi));

      ctx.beginPath();
      ctx.moveTo(selectedX, margin.top);
      ctx.lineTo(selectedX, margin.top + plotH);
      ctx.moveTo(margin.left, selectedY);
      ctx.lineTo(margin.left + plotW, selectedY);

      ctx.lineWidth = lineWidth;

    ctx.fillStyle = &#x27;#ffffff&#x27;;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = &#x27;#111111&#x27;;
    ctx.stroke();
    ctx.restore();

    const foreground = getComputedStyle(root).color || &#x27;#1a1c1f&#x27;;
    ctx.strokeStyle = foreground;
    ctx.lineWidth = 1;
    ctx.strokeRect(margin.left + 0.5, margin.top + 0.5, plotW - 1, plotH - 1);
    ctx.fillStyle = foreground;
    ctx.font = &#x27;12px system-ui, -apple-system, BlinkMacSystemFont, sans-serif&#x27;;
    ctx.textBaseline = &#x27;middle&#x27;;
    ctx.textAlign = &#x27;center&#x27;;

    const exponentLabels = {&#x27;-3&#x27;: &#x27;10⁻³&#x27;, &#x27;-2&#x27;: &#x27;10⁻²&#x27;, &#x27;-1&#x27;: &#x27;10⁻¹&#x27;, &#x27;0&#x27;: &#x27;10⁰&#x27;, &#x27;1&#x27;: &#x27;10¹&#x27;, &#x27;2&#x27;: &#x27;10²&#x27;, &#x27;3&#x27;: &#x27;10³&#x27;};
    [-3, -2, -1, 0, 1, 2, 3].forEach(value =&gt; {
      const xx = xPx(value);
      ctx.beginPath();
      ctx.moveTo(xx, margin.top + plotH);
      ctx.lineTo(xx, margin.top + plotH + 5);
      ctx.stroke();
      ctx.fillText(exponentLabels[String(value)], xx, margin.top + plotH + 18);
    });

    const phiTicks = [0, 1, 10, 100, 1000];
    ctx.textAlign = &#x27;right&#x27;;
    phiTicks.forEach(phi =&gt; {
      const yy = yPx(Math.log10(1 + phi));
      ctx.beginPath();
      ctx.moveTo(margin.left - 5, yy);
      ctx.lineTo(margin.left, yy);
      ctx.stroke();
      ctx.fillText(String(phi), margin.left - 9, yy);
    });

    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;monomer-search opportunities per ligand-bound lifetime&#x27;, margin.left + plotW / 2, height - 32);
    ctx.fillText(&#x27;η = α/δ = k₊Rₜ/koff&#x27;, margin.left + plotW / 2, height - 14);
    ctx.save();
    ctx.translate(16, margin.top + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(&#x27;HER2 abundance, φ = Hₜ/Rₜ (log spacing in 1 + φ)&#x27;, 0, 0);
    ctx.restore();

    const selected = heatValues(state.alpha / Math.max(state.delta, 1e-15), state.phi, occupancy, state);
    byId(&#x27;ev6-heat-note&#x27;).textContent = `f = ${formatNumber(occupancy)} · δ = ${formatNumber(state.delta)} · selected η = ${formatNumber(state.alpha / Math.max(state.delta, 1e-15))} · selected HER2 benefit = ${formatNumber(selected.perHundredBound)} per 100 ligand-bound receptors`;

    const showTooltip = event =&gt; {
      const rect = canvas.getBoundingClientRect();
      const px = (event.clientX - rect.left) * width / rect.width;
      const py = (event.clientY - rect.top) * height / rect.height;
      if (px &lt; margin.left || px &gt; margin.left + plotW || py &lt; margin.top || py &gt; margin.top + plotH) {
        tooltip.hidden = true;
        return;
      }
      const logEta = xMin + (px - margin.left) / plotW * (xMax - xMin);
      const logOnePlusPhi = yMin + (margin.top + plotH - py) / plotH * (yMax - yMin);
      const eta = Math.pow(10, logEta);
      const phi = Math.pow(10, logOnePlusPhi) - 1;
      const point = heatValues(eta, phi, occupancy, state);
      tooltip.innerHTML = tooltipTable(`η = ${formatNumber(eta)}; φ = ${formatNumber(phi)}`, [
        [&#x27;Ligand occupancy, f&#x27;, formatNumber(occupancy)],
        [&#x27;Monomer baseline, Y₀&#x27;, formatNumber(point.baseline)],
        [&#x27;With HER2, Y&#x27;, formatNumber(point.assisted)],
        [&#x27;HER2 benefit / 100 bound&#x27;, formatNumber(point.perHundredBound)]
      ]);
      tooltip.hidden = false;
      placeTooltip(event);
    };
    canvas.addEventListener(&#x27;pointermove&#x27;, showTooltip);
    canvas.addEventListener(&#x27;pointerdown&#x27;, showTooltip);
    canvas.addEventListener(&#x27;pointerleave&#x27;, event =&gt; {
      if (event.pointerType !== &#x27;touch&#x27;) tooltip.hidden = true;
    });
  }

  function render() {
    currentState = readState();
    updateReadouts(currentState);
    drawDoseChart(currentState);
    drawTitrationChart(currentState);
    drawHeatmap(currentState);
  }

  Object.values(controls).forEach(control =&gt; {
    control.addEventListener(&#x27;input&#x27;, render);
    control.addEventListener(&#x27;change&#x27;, render);
  });

  root.querySelectorAll(&#x27;.ev6-series-toggle&#x27;).forEach(button =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      const key = button.dataset.series;
      visible[key] = !visible[key];
      button.setAttribute(&#x27;aria-pressed&#x27;, String(visible[key]));
      render();
    });
  });

  byId(&#x27;ev6-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    controls.phi.value = &#x27;0.30103&#x27;;
    controls.alpha.value = &#x27;1&#x27;;
    controls.delta.value = &#x27;1&#x27;;
    controls.dose.value = &#x27;0&#x27;;
    controls.heatOccupancy.value = &#x27;0.1&#x27;;
    Object.keys(visible).forEach(key =&gt; { visible[key] = true; });
    root.querySelectorAll(&#x27;.ev6-series-toggle&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;));
    render();
  });

  let lastDoseWidth = 0;
  let lastTitrationWidth = 0;
  let lastHeatWidth = 0;
  const observer = new ResizeObserver(() =&gt; {
    const doseWidth = Math.round(byId(&#x27;ev6-dose-chart&#x27;).getBoundingClientRect().width);
    const titrationWidth = Math.round(byId(&#x27;ev6-titration-chart&#x27;).getBoundingClientRect().width);
    const heatWidth = Math.round(byId(&#x27;ev6-heat-chart&#x27;).getBoundingClientRect().width);
    if (Math.abs(doseWidth - lastDoseWidth) &lt; 2
      &amp;&amp; Math.abs(titrationWidth - lastTitrationWidth) &lt; 2
      &amp;&amp; Math.abs(heatWidth - lastHeatWidth) &lt; 2) return;
    lastDoseWidth = doseWidth;
    lastTitrationWidth = titrationWidth;
    lastHeatWidth = heatWidth;
    render();
  });
  observer.observe(byId(&#x27;ev6-dose-chart&#x27;));
  observer.observe(byId(&#x27;ev6-titration-chart&#x27;));
  observer.observe(byId(&#x27;ev6-heat-chart&#x27;));
  render();
})();
&lt;/script&gt;
