<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kayla Finch Mysteries</title>
    <meta
      name="description"
      content="A playable point-and-click mystery series demo about Kayla Finch, her neighborhood mystery club, a missing pet, and a not-so-haunted house."
    />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <link rel="stylesheet" href="./styles.css?v=20260704-story-layout1" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="case-label">Kayla Finch Mysteries</p>
          <h1 id="caseTitle">Case 01: The Picnic Pet</h1>
        </div>
        <div class="topbar-actions">
          <div id="xpBadge" class="xp-badge" aria-label="Detective XP">XP 100</div>
          <div class="progress-wrap" aria-label="Case progress">
            <span id="progressText">Case 1: 0 of 6 steps</span>
            <div class="progress-track">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>
          <button id="satchelButton" class="ghost-button" type="button">Satchel</button>
          <button id="notebookButton" class="ghost-button" type="button">Notebook</button>
          <button id="hintButton" class="ghost-button" type="button">Hint</button>
          <button id="voiceButton" class="ghost-button" type="button" hidden>Voice Casting</button>
          <button id="storyButton" class="ghost-button" type="button">Story</button>
          <button id="resetButton" class="ghost-button" type="button">Reset</button>
        </div>
      </header>

      <main class="game-layout">
        <section class="stage-panel" aria-label="Current mystery scene">
          <div class="scene-frame">
            <div id="sceneImage" class="scene-image">
              <div class="scene-title">
                <p id="locationSubtitle"></p>
                <h2 id="locationTitle"></h2>
              </div>
              <div id="objectiveChip" class="objective-chip"></div>
              <div id="hotspotLayer" class="hotspot-layer" aria-label="Scene hotspots"></div>
            </div>
          </div>

          <nav id="mapNav" class="map-nav" aria-label="Move to another room"></nav>
        </section>
      </main>
    </div>

    <div id="modalRoot" class="modal-root" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./game.js?v=20260704-case3-family-code1"></script>
  </body>
</html>
