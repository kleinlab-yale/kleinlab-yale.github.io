<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signal Fate: RTK Density & Affinity</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 0; background: #fafafa; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #2c3e50; color: white; padding: 15px 30px; }
        .layout { display: grid; grid-template-columns: 350px 1fr; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }
        .sidebar { background: white; padding: 25px; border-radius: 12px; border: 1px solid #ddd; display: flex; flex-direction: column; gap: 25px; }
        .main { display: grid; grid-template-rows: 1fr 280px; gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        label { font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 8px; }
        input[type=range] { width: 100%; cursor: pointer; }
        .val { float: right; color: #2980b9; font-weight: bold; font-family: monospace; }
        .desc { font-size: 0.8rem; color: #7f8c8d; line-height: 1.4; margin-top: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0">RTK Signal Fate Map</h2>
</div>

<div class="layout">
    <div class="sidebar">
        <div>
            <label>Receptor Level ([R]₀) <span class="val" id="dispR">500</span></label>
            <input type="range" id="Rtot" min="10" max="2000" value="500">
            <p class="desc">Increasing density shifts fate <b>UP and LEFT</b> (Burst).</p>
        </div>

        <div>
            <label>Dimerization K<sub>d</sub> (K<sub>d2</sub>) <span class="val" id="dispKd2">200</span></label>
            <input type="range" id="Kd2" min="1" max="1000" value="200">
            <p class="desc">Weakening K<sub>d</sub> (moving right) shifts fate <b>DOWN and RIGHT</b> (Sustained).</p>
        </div>

        <div style="margin-top:auto; padding:15px; background:#f1f2f6; border-radius:8px; border-left:5px solid #2980b9;">
            <small>
                <b>Proliferation:</b> High Amp, < 10 min.<br>
                <b>Differentiation:</b> Low Amp, > 15 min.
            </small>
        </div>
    </div>

    <div class="main">
        <div class="card" id="fatePlot"></div>
        <div class="card" id="timePlot"></div>
    </div>
</div>

<script>
    function simulate() {
        const R0 = parseFloat(document.getElementById('Rtot').value);
        const Kd2_val = parseFloat(document.getElementById('Kd2').value);
        const L0 = 100; 

        // Parameters tuned to prevent biphasic duration collapse
        const k_on = 0.15;   
        const Kd1 = 2.0;       // Strong initial capture
        const koff1 = k_on * Kd1;
        const koff2 = k_on * Kd2_val;
        const k_int = 0.08;    // Internalization

        document.getElementById('dispR').innerText = R0;
        document.getElementById('dispKd2').innerText = Kd2_val;

        let R = R0, L = L0, RL2 = 0, R2L2 = 0;
        let dt = 0.1, steps = 1000;
        let time = [], signal = [];
        let maxA = 0;

        for (let i = 0; i < steps; i++) {
            // Sequential binding: L + R -> RL2 + R -> R2L2
            let v1 = (k_on * R * L) - (koff1 * RL2);
            let v2 = (k_on * RL2 * R) - (koff2 * R2L2);
            let v_int = k_int * R2L2;

            L -= v1 * dt;
            R -= (v1 + v2) * dt;
            RL2 += (v1 - v2) * dt;
            R2L2 += (v2 - v_int) * dt;

            let s = Math.max(0, R2L2);
            if (s > maxA) maxA = s;
            time.append ? null : time.push(i * dt);
            signal.push(s);
        }

        // Calculation of Duration (Integrative approach to avoid FWHM jitter)
        // Duration = Time the signal spends above 40% of its peak
        let thresh = maxA * 0.4;
        let t1 = -1, t2 = -1;
        for(let i=0; i<signal.length; i++){
            if(t1 === -1 && signal[i] >= thresh) t1 = time[i];
            if(t1 !== -1 && t2 === -1 && signal[i] < thresh) t2 = time[i];
        }
        let duration = (t1 === -1) ? 0 : (t2 === -1 ? (steps*dt - t1) : (t2 - t1));

        render(maxA, duration, time, signal);
    }

    function render(amp, dur, tArr, sArr) {
        Plotly.newPlot('fatePlot', [{
            x: [dur], y: [amp], mode: 'markers+text',
            text: ['Current Fate'], textposition: 'top center',
            marker: { size: 22, color: '#2c3e50', line: {width: 2, color: 'white'} }
        }], {
            title: '<b>Signal Fate Map</b>',
            xaxis: { title: 'Duration (Minutes)', range: [0, 25], fixedrange: true },
            yaxis: { title: 'Amplitude (Peak R₂L₂)', range: [0, 150], fixedrange: true },
            shapes: [
                { type: 'rect', xref: 'x', yref: 'y', x0: 0, x1: 10, y0: 80, y1: 150, fillcolor: 'rgba(231, 76, 60, 0.1)', line: {width: 0} },
                { type: 'rect', xref: 'x', yref: 'y', x0: 15, x1: 25, y0: 0, y1: 60, fillcolor: 'rgba(39, 174, 96, 0.1)', line: {width: 0} }
            ],
            annotations: [
                { x: 5, y: 140, text: 'PROLIFERATION', showarrow: false, font: {color: '#c0392b', size: 14} },
                { x: 20, y: 10, text: 'DIFFERENTIATION', showarrow: false, font: {color: '#27ae60', size: 14} }
            ],
            margin: { t: 50, l: 50, r: 30, b: 50 }
        });

        Plotly.newPlot('timePlot', [{
            x: tArr, y: sArr, fill: 'tozeroy', line: {color: '#2980b9', width: 3}
        }], {
            title: 'Active Signal Over Time',
            xaxis: { title: 'Time (min)', range: [0, 40] },
            yaxis: { title: 'Intensity' },
            margin: { t: 40, b: 40, l: 50, r: 30 }, height: 240
        });
    }

    document.querySelectorAll('input').forEach(i => i.addEventListener('input', simulate));
    simulate();
</script>
</body>
</html>
