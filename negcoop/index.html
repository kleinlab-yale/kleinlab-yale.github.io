<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RTK Signal Fate: Density vs. Dimerization Kd</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #fdfdfd; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #2c3e50; color: white; padding: 1rem 2rem; }
        .main { display: grid; grid-template-columns: 360px 1fr; flex: 1; overflow: hidden; padding: 20px; gap: 20px; }
        .sidebar { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; display: flex; flex-direction: column; gap: 30px; }
        .visuals { display: grid; grid-template-rows: 1.2fr 0.8fr; gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #eee; }
        label { font-weight: bold; font-size: 0.9rem; color: #34495e; display: block; margin-bottom: 10px; }
        input[type=range] { width: 100%; cursor: pointer; }
        .val { float: right; color: #e67e22; font-family: monospace; font-size: 1.1rem; }
        .desc { font-size: 0.8rem; color: #7f8c8d; line-height: 1.4; margin-top: 5px; }
        .fate-box { margin-top: auto; padding: 15px; background: #fcf3cf; border-radius: 8px; border-left: 5px solid #f1c40f; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="header">
    <h2 style="margin:0">RTK Signal Fate (Jenni et al. Model)</h2>
</div>

<div class="main">
    <div class="sidebar">
        <div>
            <label>Receptor Level ([R]₀) <span class="val" id="dispR">500</span></label>
            <input type="range" id="Rtot" min="10" max="2000" value="500">
            <p class="desc">Higher density drives rapid dimerization: <b>Amplitude ↑ | Duration ↓</b></p>
        </div>

        <div>
            <label>Dimerization K<sub>d</sub> (K<sub>d2</sub>) <span class="val" id="dispKd">200</span></label>
            <input type="range" id="Kd2" min="1" max="1500" value="200">
            <p class="desc">Higher K<sub>d</sub> = Weaker Binding (Neg. Coop).<br><b>Amplitude ↓ | Duration ↑</b></p>
        </div>

        <div class="fate-box">
            <b>Dynamics Key:</b><br>
            • <b>Low Kd / High R:</b> Proliferation (Burst)<br>
            • <b>High Kd / Low R:</b> Differentiation (Sustained)
        </div>
    </div>

    <div class="visuals">
        <div class="card" id="fatePlot"></div>
        <div class="card" id="timePlot"></div>
    </div>
</div>

<script>
    function simulate() {
        const R0 = parseFloat(document.getElementById('Rtot').value);
        const Kd2 = parseFloat(document.getElementById('Kd2').value);
        
        // Physics-based constants
        const L0 = 100;        // Initial Ligand Dimer
        const k_on = 0.1;      // Association rate
        const Kd1 = 1.0;       // Strong fixed capture affinity
        const k_off1 = k_on * Kd1;
        const k_off2 = k_on * Kd2; // Larger Kd2 -> much faster dissociation
        const k_int = 0.08;    // Internalization of active R2L2

        document.getElementById('dispR').innerText = R0;
        document.getElementById('dispKd').innerText = Kd2;

        // ODE Simulation
        let R = R0, L = L0, RL2 = 0, R2L2 = 0;
        let dt = 0.05, steps = 1000;
        let time = [], signal = [];
        let maxAmp = 0;

        for (let i = 0; i < steps; i++) {
            // v1: Formation of RL2 (intermediate)
            let v1 = (k_on * R * L) - (k_off1 * RL2);
            // v2: Formation of R2L2 (Active Signal)
            let v2 = (k_on * RL2 * R) - (k_off2 * R2L2);
            // v_int: Loss of signal
            let v_int = k_int * R2L2;

            L -= v1 * dt;
            R -= (v1 + v2) * dt;
            RL2 += (v1 - v2) * dt;
            R2L2 += (v2 - v_int) * dt;

            let curS = Math.max(0, R2L2);
            if (curS > maxAmp) maxAmp = curS;
            time.push(i * dt);
            signal.push(curS);
        }

        // Duration: Time signal stays above 20% of max possible amp (stable threshold)
        let threshold = 5; 
        let t_start = -1, t_end = -1;
        for(let i=0; i<signal.length; i++) {
            if(t_start === -1 && signal[i] > threshold) t_start = time[i];
            if(signal[i] > threshold) t_end = time[i];
        }
        let duration = (t_start === -1) ? 0 : (t_end - t_start);

        render(maxAmp, duration, time, signal);
    }

    function render(amp, dur, tArr, sArr) {
        // Fate Map
        Plotly.newPlot('fatePlot', [{
            x: [dur], y: [amp], mode: 'markers',
            marker: { size: 25, color: '#2c3e50', line: {width: 3, color: 'white'} },
            name: 'Fate'
        }], {
            title: '<b>Signal Fate Map: Amplitude vs Duration</b>',
            xaxis: { title: 'Duration (Minutes)', range: [0, 25] },
            yaxis: { title: 'Amplitude (Max [R₂L₂])', range: [0, 160] },
            shapes: [
                { type: 'rect', xref: 'x', yref: 'y', x0: 0, x1: 10, y0: 80, y1: 160, fillcolor: 'rgba(231, 76, 60, 0.15)', line: {width: 0} },
                { type: 'rect', xref: 'x', yref: 'y', x0: 14, x1: 25, y0: 0, y1: 60, fillcolor: 'rgba(46, 204, 113, 0.15)', line: {width: 0} }
            ],
            annotations: [
                { x: 5, y: 145, text: 'PROLIFERATION', showarrow: false, font: {color: '#c0392b', weight: 'bold'} },
                { x: 20, y: 15, text: 'DIFFERENTIATION', showarrow: false, font: {color: '#27ae60', weight: 'bold'} }
            ],
            margin: { t: 50, b: 50, l: 60, r: 30 }
        }, {staticPlot: true});

        // Kinetics
        Plotly.newPlot('timePlot', [{
            x: tArr, y: sArr, fill: 'tozeroy', line: {color: '#e67e22', width: 3}
        }], {
            title: 'Signal Kinetics (Active R₂L₂)',
            xaxis: { title: 'Time (min)', range: [0, 40] },
            yaxis: { title: 'Concentration' },
            margin: { t: 40, b: 40, l: 60, r: 30 }
        }, {staticPlot: true});
    }

    document.querySelectorAll('input').forEach(i => i.addEventListener('input', simulate));
    simulate();
</script>
</body>
</html>
